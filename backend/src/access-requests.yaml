openapi: 3.0.3
info:
  title: Access Request API
  version: 1.0.0
  description: >-
    A signed-in person asks admins for access to private Datasets (docs/adr/0081, docs/adr/0082).
    Merged into openapi.yaml at startup, and complete on its own.
servers:
  - url: /api/v1
  - url: /
tags:
  - name: access-requests
    description: Asking for access to private Datasets, and deciding

paths:
  /access-requests:
    get:
      x-eov-operation-handler: controllers/access-requests
      x-eov-operation-id: getAccessRequests
      x-plugin-token-denied: true
      summary: List Access Requests, for admins
      description: >-
        `pending` (the default) lists the requests with a Dataset still waiting for a decision,
        oldest first. `all` lists the latest 200 of every state, newest first.
      tags:
        - access-requests
      security:
        - bearerAuth: [super-admin, data-admin]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - all
            default: pending
      responses:
        '200':
          description: Access Requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      x-eov-operation-handler: controllers/access-requests
      x-eov-operation-id: createAccessRequest
      x-entitlements-required: true
      summary: Ask for access to private Datasets
      description: >-
        Only for a person whose access token carries `email`, so that an approval is keyed by
        their email: anyone else gets a 403 with `email_required` (docs/adr/0081). Names
        private, published Datasets that allow access requests (`allow_access_requests`): a public
        one, or one that doesn't allow them, is a 400, and one not published is a 404 like an
        unknown one. Asking for what the caller already holds on one is a 400, and
        a Dataset already in one of the caller's pending requests is a 409 carrying
        `pending_request_id` (docs/adr/0082). Carries what the requester says about themselves,
        which nothing checks.
      tags:
        - access-requests
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRequestCreate'
      responses:
        '201':
          description: The Access Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A Dataset is already in one of the caller's pending requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      pending_request_id:
                        type: string
                        format: uuid

  /access-requests/mine:
    get:
      x-eov-operation-handler: controllers/access-requests
      x-eov-operation-id: getMyAccessRequests
      x-plugin-token-denied: true
      summary: The caller's own Access Requests, newest first
      tags:
        - access-requests
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Access Requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /access-requests/{requestId}:
    delete:
      x-eov-operation-handler: controllers/access-requests
      x-eov-operation-id: withdrawAccessRequest
      summary: Withdraw an Access Request
      description: The requester withdraws whatever in it is still pending. Decisions already made stay.
      tags:
        - access-requests
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccessRequestId'
      responses:
        '204':
          description: Withdrawn
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /access-requests/{requestId}/decisions:
    post:
      x-eov-operation-handler: controllers/access-requests
      x-eov-operation-id: decideAccessRequest
      summary: Decide Datasets of an Access Request
      description: >-
        Approves or denies some of the request's Datasets. An approval grants straight to the
        requester's Subject, the capabilities asked for or fewer, and only on a Dataset still
        published, private and not archived: otherwise it is a 409, and the Dataset can still be
        denied. The admin's `reason` goes with an approval or a denial and is shown to the
        requester. A Dataset already decided is a 409.
      tags:
        - access-requests
      security:
        - bearerAuth: [super-admin, data-admin]
      parameters:
        - $ref: '#/components/parameters/AccessRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - decisions
              properties:
                decisions:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/AccessRequestDecision'
      responses:
        '200':
          description: The Access Request after the decisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      $ref: '../src/openapi.yaml#/components/securitySchemes/bearerAuth'

  parameters:
    AccessRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      $ref: '../src/openapi.yaml#/components/responses/BadRequest'
    Unauthorized:
      $ref: '../src/openapi.yaml#/components/responses/Unauthorized'
    Forbidden:
      $ref: '../src/openapi.yaml#/components/responses/Forbidden'
    NotFound:
      $ref: '../src/openapi.yaml#/components/responses/NotFound'
    Conflict:
      $ref: '../src/openapi.yaml#/components/responses/Conflict'

  schemas:
    ErrorResponse:
      $ref: '../src/openapi.yaml#/components/schemas/ErrorResponse'

    AccessRequestCapabilities:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        enum:
          - preview
          - download

    CountryCode:
      type: string
      description: ISO 3166-1 alpha-2 code, as assigned
      enum: [
          'AD', 'AE', 'AF', 'AG', 'AI', 'AL', 'AM', 'AO', 'AQ', 'AR', 'AS', 'AT', 'AU', 'AW', 'AX', 'AZ',
          'BA', 'BB', 'BD', 'BE', 'BF', 'BG', 'BH', 'BI', 'BJ', 'BL', 'BM', 'BN', 'BO', 'BQ', 'BR', 'BS', 'BT', 'BV', 'BW', 'BY', 'BZ',
          'CA', 'CC', 'CD', 'CF', 'CG', 'CH', 'CI', 'CK', 'CL', 'CM', 'CN', 'CO', 'CR', 'CU', 'CV', 'CW', 'CX', 'CY', 'CZ',
          'DE', 'DJ', 'DK', 'DM', 'DO', 'DZ',
          'EC', 'EE', 'EG', 'EH', 'ER', 'ES', 'ET',
          'FI', 'FJ', 'FK', 'FM', 'FO', 'FR',
          'GA', 'GB', 'GD', 'GE', 'GF', 'GG', 'GH', 'GI', 'GL', 'GM', 'GN', 'GP', 'GQ', 'GR', 'GS', 'GT', 'GU', 'GW', 'GY',
          'HK', 'HM', 'HN', 'HR', 'HT', 'HU',
          'ID', 'IE', 'IL', 'IM', 'IN', 'IO', 'IQ', 'IR', 'IS', 'IT',
          'JE', 'JM', 'JO', 'JP',
          'KE', 'KG', 'KH', 'KI', 'KM', 'KN', 'KP', 'KR', 'KW', 'KY', 'KZ',
          'LA', 'LB', 'LC', 'LI', 'LK', 'LR', 'LS', 'LT', 'LU', 'LV', 'LY',
          'MA', 'MC', 'MD', 'ME', 'MF', 'MG', 'MH', 'MK', 'ML', 'MM', 'MN', 'MO', 'MP', 'MQ', 'MR', 'MS', 'MT', 'MU', 'MV', 'MW', 'MX', 'MY', 'MZ',
          'NA', 'NC', 'NE', 'NF', 'NG', 'NI', 'NL', 'NO', 'NP', 'NR', 'NU', 'NZ',
          'OM',
          'PA', 'PE', 'PF', 'PG', 'PH', 'PK', 'PL', 'PM', 'PN', 'PR', 'PS', 'PT', 'PW', 'PY',
          'QA',
          'RE', 'RO', 'RS', 'RU', 'RW',
          'SA', 'SB', 'SC', 'SD', 'SE', 'SG', 'SH', 'SI', 'SJ', 'SK', 'SL', 'SM', 'SN', 'SO', 'SR', 'SS', 'ST', 'SV', 'SX', 'SY', 'SZ',
          'TC', 'TD', 'TF', 'TG', 'TH', 'TJ', 'TK', 'TL', 'TM', 'TN', 'TO', 'TR', 'TT', 'TV', 'TW', 'TZ',
          'UA', 'UG', 'UM', 'US', 'UY', 'UZ',
          'VA', 'VC', 'VE', 'VG', 'VI', 'VN', 'VU',
          'WF', 'WS',
          'YE', 'YT',
          'ZA', 'ZM', 'ZW'
        ]

    AccessRequestCreate:
      type: object
      additionalProperties: false
      required:
        - datasets
        - capabilities
        - message
        - requester_name
        - country
        - organisation
      description: Text fields are trimmed and must not be blank.
      properties:
        datasets:
          type: array
          description: Dataset slugs; any slug a Dataset has held works
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
        capabilities:
          $ref: '#/components/schemas/AccessRequestCapabilities'
        message:
          type: string
          minLength: 1
          maxLength: 1000
          description: Why the access is needed, shown to admins
        requester_name:
          type: string
          minLength: 1
          maxLength: 200
        country:
          $ref: '#/components/schemas/CountryCode'
        organisation:
          type: string
          minLength: 1
          maxLength: 200
        organisation_website:
          type: string
          maxLength: 2048
          description: >-
            An http(s) address; a bare domain gets `https://`. Blank is the same as absent.

    AccessRequestDecision:
      type: object
      additionalProperties: false
      required:
        - dataset
        - approve
      properties:
        dataset:
          type: string
          description: The Dataset's slug, as the request lists it
        approve:
          type: boolean
        capabilities:
          allOf:
            - $ref: '#/components/schemas/AccessRequestCapabilities'
          description: What an approval grants; what was asked for when left out
        reason:
          type: string
          maxLength: 1000
          description: The admin's message with the approval or denial, shown to the requester

    AccessRequest:
      type: object
      required:
        - id
        - requested_by
        - capabilities
        - message
        - requester_name
        - country
        - organisation
        - organisation_website
        - status
        - created_at
        - items
      description: >-
        What the requester said about themselves is unchecked, and null on requests made before it
        was asked for.
      properties:
        id:
          type: string
          format: uuid
        requested_by:
          type: string
        capabilities:
          $ref: '#/components/schemas/AccessRequestCapabilities'
        message:
          type: string
          nullable: true
        requester_name:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
          description: ISO 3166-1 alpha-2 code of the country the requester lives or works in
        organisation:
          type: string
          nullable: true
        organisation_website:
          type: string
          nullable: true
          description: Always with its `http(s)://`
        status:
          type: string
          enum:
            - pending
            - finished
            - withdrawn
        created_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
            required:
              - dataset
              - status
              - granted
              - reason
              - decided_at
            properties:
              dataset:
                type: object
                required:
                  - slug
                  - name
                properties:
                  slug:
                    type: string
                  name:
                    type: string
                  visibility:
                    type: string
                    enum:
                      - public
                      - private
                    description: Admins only, as `published` and `archived`. An approval needs a private, published Dataset that is not archived.
                  published:
                    type: boolean
                  archived:
                    type: boolean
              status:
                type: string
                enum:
                  - pending
                  - approved
                  - denied
                  - withdrawn
              granted:
                type: array
                nullable: true
                items:
                  type: string
              reason:
                type: string
                nullable: true
                description: The admin's message with the decision; null when they gave none
              decided_at:
                type: string
                format: date-time
                nullable: true
              decided_by:
                type: string
                nullable: true
                description: Admins only
