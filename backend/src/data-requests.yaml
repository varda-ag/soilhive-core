openapi: 3.0.0
info:
  version: 1.0.0
  title: Data requests
  description: Schemas for the /data-requests endpoints
components:
  schemas:
    DataRequestSubmission:
      type: object
      description: >-
        Payload submitted to POST /data-requests. Which product is computed is chosen by
        statistics_type; the aggregation areas are resolved identically for every type, and only
        what is computed over them differs.
      additionalProperties: false
      required:
        - statistics_type
        - filter_id
        - time_aggregation
      properties:
        statistics_type:
          type: string
          enum: [descriptive, class-distribution, value-range, correlation]
          description: >-
            Which product to compute, for one variable (two for `correlation`). `descriptive` gives count,
            extremes, mean, spread and percentiles per dataset, aggregation area, year window and
            depth bucket, plus the same per dataset over the whole request. `class-distribution` gives the percentage or number of one
            soil property's observations in each of the given classes, per dataset, aggregation
            area, year window and depth bucket. `value-range` gives just how many observations
            of one soil property match, at how many locations, and their lowest and highest
            values, for the whole request and per dataset. `correlation` pairs two soil
            properties at the same locations and gives Pearson r, Spearman rho, r squared and the
            least-squares fit of y on x, plus a sample of the points, per dataset, aggregation
            area, year window and depth bucket. Required, and never defaulted.
        filter_id:
          type: string
          format: uuid
          description: >-
            Filter supplying the criteria. Also supplies the aggregation areas, unless
            file_id is given — in which case the filter's own geometries are not used.
        file_id:
          type: string
          description: >-
            Optional spatial file whose geometries each become one aggregation area. Must
            be a vector file with a known EPSG code and only polygon or multipolygon
            geometries; a multipolygon counts as one area. The number of geometries is
            capped by server configuration. A file mapped to a Dataset is not found.
        dataset_ids:
          type: array
          items:
            type: string
          description: >-
            Optional list of dataset IDs. When given, preview access to each is enforced
            on submission. When omitted, every dataset the filter matches is used and
            those without preview access are skipped. Which ones were skipped is no longer
            reported back — it reaches the server log only.
        variable:
          $ref: '#/components/schemas/ClassDistributionVariable'
        variable_x:
          $ref: '#/components/schemas/CorrelationVariable'
        variable_y:
          $ref: '#/components/schemas/CorrelationVariable'
        measure:
          type: string
          enum: [mean, median]
          description: >-
            Required for, and only accepted with, statistics_type `correlation`: how the values of
            one soil property at one location, in one year window and depth range, are reduced to
            one value before pairing.
        classes:
          type: array
          minItems: 1
          maxItems: 20
          description: >-
            Only accepted with statistics_type `class-distribution`, which needs either this or
            class_count with class_method, never both. The classes the variable's values are
            sorted into, in the order the output reports them. Each class includes its min and
            excludes its max; classes must not overlap (touching bounds are fine), names must be
            unique, and `unclassified` is reserved.
          items:
            $ref: '#/components/schemas/ClassDefinition'
        class_count:
          type: integer
          minimum: 3
          maximum: 20
          description: >-
            Only accepted with statistics_type `class-distribution`, instead of classes: how many
            classes to generate from the matching observations, in total. Requires class_method.
            The classes are generated once for the whole request, each observation counted once,
            so every row shares them; the first is open below and the last open above, so nothing
            is unclassified. Repeated values can yield fewer classes than asked for, never more.
        class_method:
          type: string
          enum: [equal-interval, quantile]
          description: >-
            Required with class_count, and rejected without it. `equal-interval` gives equal-width
            classes over the 1st-99th percentile range, rounded to readable edges (for histograms),
            with anything beyond it in the open first and last class. `quantile` gives each class
            about the same number of observations, with edges rounded to 3 decimals.
        time_aggregation:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 10
            - type: string
              enum: [none]
          description: >-
            Required. Year window size in years, aligned to multiples of it (for 3: 2016-2018,
            2019-2021), or `none` to pool every year.
        depth_ranges:
          type: string
          enum: [none, standard]
          description: >-
            `descriptive`, `class-distribution` and `correlation` only; `correlation` requires
            `standard`. `none` (the default) pools
            every depth into one bucket, which mixes horizons. `standard` sorts each observation
            into the GlobalSoilMap range (0-5, 5-15, 15-30, 30-60, 60-100, 100-200 cm, and deeper
            than 200) holding its layer's depth midpoint, so a 0-30 cm composite is reported at
            15-30 cm.
        value_type:
          type: string
          enum: [percentage, count]
          description: >-
            Required for, and only accepted with, statistics_type `class-distribution`: what each
            class value in the output holds. `percentage` is the share of the row's observations,
            rounded to 3 decimals, so a row's values sum to 100; `count` is the number of
            observations, so they sum to the row's count. Never defaulted.
        label_field:
          type: string
          description: >-
            Optional field of file_id whose value labels each aggregation area. Must name
            an existing field of that file.
        config_id:
          type: string
          description: >-
            Optional plugin config item (plugin:{pluginId}:{id}) to attach the request to. It
            must exist and the caller needs write on it. An attached request is readable only with
            read on that item, deletable only with write, and is destroyed when the item is
            deleted. Without it, the id alone grants both.

    DataRequestParameters:
      type: object
      description: >-
        What was asked, plus what resolving it produced. The resolved half is part of the question
        rather than the answer, and is what makes the result interpretable: unit_id in the result
        is an opaque identifier, and units below is the only place its label and area appear.
      required:
        - statistics_type
        - filter_id
        - derived_filter_id
        - unit_count
        - units
      properties:
        statistics_type:
          type: string
          enum: [descriptive, class-distribution, value-range, correlation]
        filter_id:
          type: string
          format: uuid
        file_id:
          type: string
        dataset_ids:
          type: array
          items:
            type: string
        variable:
          $ref: '#/components/schemas/ClassDistributionVariable'
        variable_x:
          $ref: '#/components/schemas/CorrelationVariable'
        variable_y:
          $ref: '#/components/schemas/CorrelationVariable'
        measure:
          type: string
          enum: [mean, median]
        classes:
          type: array
          items:
            $ref: '#/components/schemas/ClassDefinition'
        class_count:
          type: integer
        class_method:
          type: string
          enum: [equal-interval, quantile]
        time_aggregation:
          oneOf:
            - type: integer
            - type: string
              enum: [none]
        depth_ranges:
          type: string
          enum: [none, standard]
        value_type:
          type: string
          enum: [percentage, count]
        label_field:
          type: string
        config_id:
          type: string
        derived_filter_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Filter holding the aggregation areas when they came from file_id; null when they are
            the filter's own geometries.
        unit_count:
          type: integer
          description: Number of aggregation areas resolved.
        units:
          type: array
          items:
            $ref: '#/components/schemas/AggregationUnit'

    AggregationUnit:
      type: object
      description: One aggregation area the statistics are reported for.
      required:
        - unit_id
        - label
        - record_ids
        - area_m2
        - raster_filtered
      properties:
        unit_id:
          type: string
          format: uuid
          description: Identifier this area's statistics are reported under.
        label:
          type: string
          nullable: true
          description: Value of label_field for the source row, when one was given.
        record_ids:
          type: array
          items:
            type: integer
          description: Source rows that resolved to this area — several when the file repeats a geometry.
        area_m2:
          type: number
          nullable: true
        raster_filtered:
          type: boolean
          description: >-
            True when raster filters applied. The area is unchanged by them, so the effective area
            the statistics cover is smaller than area_m2.

    DataRequest:
      type: object
      description: >-
        One data request and the outcome of its run. Progress fields are present only while the
        underlying run still exists; data is present only once the run completed.
      required:
        - id
        - status
        - created_at
        - completed_at
        - message
        - request
      properties:
        id:
          type: string
          format: uuid
          description: >-
            Identifies the request and is the whole of the permission to read or delete it. Treat
            it as a secret: anyone holding it has the same access as whoever submitted the request.
        status:
          type: string
          enum: [pending, running, completed, failed]
        created_at:
          type: string
          format: date-time
          description: When the request was submitted.
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: When the run reached its outcome; null while it is pending or running.
        progress_percentage:
          type: integer
          description: Absent once the underlying run has been removed by retention.
        progress_description:
          type: string
          description: Absent once the underlying run has been removed by retention.
        message:
          type: string
          nullable: true
          description: Why the request failed. Null unless status is `failed`.
        request:
          $ref: '#/components/schemas/DataRequestParameters'
        data:
          description: >-
            The result, whose shape is chosen by request.statistics_type. Absent until the request
            completes, and never present for a failed one.
          oneOf:
            - $ref: '#/components/schemas/SoilStatistics'
            - $ref: '#/components/schemas/ClassDistribution'
            - $ref: '#/components/schemas/ValueRange'
            - $ref: '#/components/schemas/Correlation'

    ValueRangeFigures:
      type: object
      description: Exactly one of n_observations and n_scores is present; 0 when nothing matched.
      properties:
        n_observations:
          type: integer
          description: Observations behind the figures, for a soil property. Absent for a soil index.
        n_scores:
          type: integer
          description: Scores behind the figures, for a soil index. Absent for a soil property.
        n_features:
          type: integer
          description: Distinct sampling locations behind n_observations. Absent for a soil index.
        min:
          type: number
          description: Lowest value, in standard_unit. Absent when count is 0.
        max:
          type: number
          description: Highest value, in standard_unit. Absent when count is 0.

    ValueRange:
      description: >-
        The result of a `value-range` data request. The top-level figures cover the whole request
        and all years, each observation (or score) counted once however many aggregation areas it
        falls in. For a
        soil property, datasets gives the same figures per dataset, listing only datasets with at
        least one matching observation; for a soil index there is no datasets, since scores belong
        to no dataset.
      allOf:
        - $ref: '#/components/schemas/ValueRangeFigures'
        - type: object
          properties:
            soil_property:
              type: string
              description: Present when variable.type is `soil-property`.
            standard_unit:
              type: string
              nullable: true
              description: Present when variable.type is `soil-property`. The unit values and class bounds are in.
            run:
              type: string
              format: uuid
              description: Present when variable.type is `soil-index`. The soil index run whose scores were read.
            soil_index_type:
              type: string
              description: >-
                Present when variable.type is `soil-index` and the run scored anything. Scores have no
                unit of measure.
            windows:
              type: array
              description: Whole request per year window. Absent when time_aggregation is none.
              items:
                allOf:
                  - $ref: '#/components/schemas/ValueRangeFigures'
                  - $ref: '#/components/schemas/YearKeys'
            datasets:
              type: array
              description: Per dataset and year window; no year keys when time_aggregation is none.
              items:
                allOf:
                  - $ref: '#/components/schemas/ValueRangeFigures'
                  - $ref: '#/components/schemas/YearKeys'
                  - type: object
                    required:
                      - dataset_id
                    properties:
                      dataset_id:
                        type: string

    YearKeys:
      type: object
      properties:
        year_start:
          type: integer
          nullable: true
          description: Null for the no-year bucket.
        year_end:
          type: integer
          nullable: true

    ClassDistributionVariable:
      type: object
      description: >-
        Required by every statistics_type except `correlation`: what it is computed for. A `soil-property` must exist and be admitted by
        the filter's own soil property criterion, if it has one. A `soil-index` names a completed
        soil index run, whose scores are read in place of observations: each score belongs to the
        areas containing its representative point, only scores whose year falls within the filter's
        min_sampling_date and max_sampling_date count, its other criteria are ignored, and
        dataset_ids and depth_ranges are rejected. Holding the run id
        is the whole of the permission to read its scores.
      additionalProperties: false
      required:
        - type
        - id
      properties:
        type:
          type: string
          enum: [soil-property, soil-index]
        id:
          type: string
          description: ID of the soil property, or the id of the soil index run.

    CorrelationVariable:
      type: object
      description: >-
        One axis of a `correlation`, required there and rejected otherwise. Only `soil-property`
        is supported: soil indexes are rejected. It must exist, be admitted by the filter's own
        soil property criterion, if it has one, and differ from the other axis.
      additionalProperties: false
      required:
        - type
        - id
      properties:
        type:
          type: string
          enum: [soil-property, soil-index]
        id:
          type: string
          description: ID of the soil property.

    ClassDefinition:
      type: object
      description: >-
        One class, in the soil property's standard unit. At least one bound is required; an
        absent bound is unbounded on that side.
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        min:
          type: number
          description: Included in the class.
        max:
          type: number
          description: Excluded from the class.

    ClassDistribution:
      type: object
      description: >-
        The result of a `class-distribution` data request: one row per dataset, aggregation area,
        year window and depth bucket that holds any observations. A missing row means no
        observations, never a small or empty one: every row is emitted, however few observations
        it holds, so check count before trusting a distribution.
      required:
        - classes
        - results
      properties:
        soil_property:
          type: string
          description: Present when variable.type is `soil-property`.
        standard_unit:
          type: string
          nullable: true
          description: Present when variable.type is `soil-property`. The unit values and class bounds are in.
        run:
          type: string
          format: uuid
          description: Present when variable.type is `soil-index`. The soil index run whose scores were read.
        soil_index_type:
          type: string
          description: >-
            Present when variable.type is `soil-index` and the run scored anything. Scores have no
            unit of measure.
        classes:
          type: array
          description: >-
            The classes every row's class names refer to, in order: the request's own, or those
            generated from class_count and class_method. Generated classes depend on the data at
            the time of the run, so two runs of the same request can differ. Empty when classes
            were to be generated and no observation matched.
          items:
            $ref: '#/components/schemas/ClassDefinition'
        observed_min:
          type: number
          description: >-
            Lowest observation value across the whole request, for labelling the open first
            class. Absent when no observation matched.
        observed_max:
          type: number
          description: >-
            Highest observation value across the whole request, for labelling the open last
            class. Absent when no observation matched.
        results:
          type: array
          items:
            $ref: '#/components/schemas/ClassDistributionRow'

    ClassDistributionRow:
      type: object
      description: >-
        One distribution, ready to chart. Observations are counted once per area they fall in, so
        an observation inside two overlapping areas counts in both.
      required:
        - unit_id
        - classes
      properties:
        dataset_id:
          type: string
          description: Absent for a soil index, whose scores belong to no dataset.
        unit_id:
          type: string
          format: uuid
          description: The aggregation area, as reported in request.units.
        year_start:
          type: integer
          nullable: true
          description: First year of the window; null for the no-year bucket, absent when time_aggregation is none.
        year_end:
          type: integer
          nullable: true
          description: Last year of the window; null for observations with no recorded year.
        depth_start:
          type: integer
          nullable: true
          description: >-
            Present only when depth_ranges is `standard`: the shallow edge of the standard range,
            in cm, included. Null, together with depth_end, for layers with no recorded depth.
        depth_end:
          type: integer
          nullable: true
          description: >-
            Present only when depth_ranges is `standard`: the deep edge of the standard range, in
            cm, excluded. Null on its own for the range deeper than 200 cm.
        depth_min:
          type: integer
          description: >-
            Shallowest depth covered by the layers behind this row, in cm; absent when none
            records a depth. Tells a 15-30 cm row built from 0-30 cm composites apart from true
            15-30 cm samples.
        depth_max:
          type: integer
          description: Deepest depth covered by the layers behind this row, in cm.
        n_observations:
          type: integer
          description: Observations behind the figures, for a soil property. Absent for a soil index.
        n_scores:
          type: integer
          description: Scores behind the figures, for a soil index. Absent for a soil property.
        n_features:
          type: integer
          description: Distinct sampling locations behind n_observations. Absent for a soil index.
        classes:
          type: array
          description: >-
            Every class of the top-level classes, in order, then `unclassified` when any observation
            fell in no class. Each value is what request.value_type says: the percentage of the row's
            values in the class (rounded to 3 decimals, summing to 100) or their number (summing to
            n_observations, or n_scores). Either way the array can be charted as is.
          items:
            type: object
            required:
              - name
              - value
            properties:
              name:
                type: string
              value:
                type: number

    SoilStatistics:
      type: object
      description: >-
        The result of a `descriptive` data request. Opens with soil_property and standard_unit, or
        run and soil_index_type for a soil index. Rows omit fields with no value.
      required:
        - overall
        - results
      properties:
        soil_property:
          type: string
        standard_unit:
          type: string
          nullable: true
        run:
          type: string
          format: uuid
        soil_index_type:
          type: string
        overall:
          type: array
          description: Per dataset, year window and depth bucket over the whole request, each observation counted once.
          items:
            $ref: '#/components/schemas/SoilStatisticsRow'
        results:
          type: array
          description: Per dataset, aggregation area, year window and depth bucket.
          items:
            $ref: '#/components/schemas/SoilStatisticsRow'

    SoilStatisticsRow:
      type: object
      description: >-
        Statistics rounded to 3 decimals. Bucket keys follow class-distribution rows: absent for a
        pooled dimension, null for the no-year or no-depth bucket.
      required:
        - min
        - lower_fence
        - upper_fence
        - n_outliers_low
        - n_outliers_high
        - whisker_low
        - whisker_high
        - p05
        - p25
        - median
        - p75
        - p95
        - max
        - mean
      properties:
        dataset_id:
          type: string
          description: Absent for a soil index.
        unit_id:
          type: string
          format: uuid
          description: Absent on overall rows.
        year_start:
          type: integer
          nullable: true
        year_end:
          type: integer
          nullable: true
        depth_start:
          type: integer
          nullable: true
        depth_end:
          type: integer
          nullable: true
        n_observations:
          type: integer
          description: Observations behind the figures, for a soil property. Absent for a soil index.
        n_scores:
          type: integer
          description: Scores behind the figures, for a soil index. Absent for a soil property.
        n_features:
          type: integer
          description: Distinct sampling locations. Absent for a soil index.
        min:
          type: number
        p05:
          type: number
        p25:
          type: number
        median:
          type: number
        p75:
          type: number
        p95:
          type: number
        max:
          type: number
        mean:
          type: number
        stddev:
          type: number
          description: Sample standard deviation; absent below 2 values.
        lower_fence:
          type: number
          description: Tukey fence p25 - 1.5·(p75 - p25); values below it are outliers.
        upper_fence:
          type: number
          description: Tukey fence p75 + 1.5·(p75 - p25); values above it are outliers.
        n_outliers_low:
          type: integer
        n_outliers_high:
          type: integer
        whisker_low:
          type: number
          description: Lowest value inside the fences, where a box plot's lower whisker ends.
        whisker_high:
          type: number
          description: Highest value inside the fences, where a box plot's upper whisker ends.
        depth_min:
          type: integer
          description: Depth span of the layers behind this row.
        depth_max:
          type: integer
        horizons:
          type: array
          items:
            type: string
        laboratory_methods:
          type: array
          items:
            type: string
          description: More than one means the figures mix measurement methods.

    CorrelationAxis:
      type: object
      required:
        - soil_property
        - standard_unit
      properties:
        soil_property:
          type: string
        standard_unit:
          type: string
          nullable: true

    CorrelationStatistics:
      type: object
      description: >-
        Rounded to 3 decimals. n_points is always present. The other five are absent together when
        n_points is below min_points, or when x or y does not vary.
      required:
        - n_points
      properties:
        dataset_id:
          type: string
        year_start:
          type: integer
          nullable: true
          description: Null for layers with no sampling year; absent when time_aggregation is none.
        year_end:
          type: integer
          nullable: true
        depth_start:
          type: integer
          description: Standard depth range holding the layer's midpoint. Layers without depth are left out.
        depth_end:
          type: integer
          nullable: true
          description: Null for the range deeper than 200 cm.
        n_points:
          type: integer
          description: Locations with both values in this row.
        pearson_r:
          type: number
        spearman_rho:
          type: number
          description: Pearson r of the ranks; tied values share their average rank.
        r_squared:
          type: number
          description: pearson_r squared.
        slope:
          type: number
          description: Least-squares fit of y on x.
        intercept:
          type: number

    Correlation:
      type: object
      description: >-
        The result of a `correlation` data request. Per location, year window and standard depth
        range, the values of each soil property are reduced with request.measure, then x and y are
        paired. Pairs never mix datasets. A missing row means no points.
      required:
        - x
        - y
        - min_points
        - max_points
        - overall
        - results
      properties:
        x:
          $ref: '#/components/schemas/CorrelationAxis'
        y:
          $ref: '#/components/schemas/CorrelationAxis'
        min_points:
          type: integer
          description: Fewest points for which the statistics are given.
        max_points:
          type: integer
          description: Most points a results row sends.
        overall:
          type: array
          description: Per dataset, year window and depth range over the whole request, each location counted once.
          items:
            allOf:
              - $ref: '#/components/schemas/CorrelationStatistics'
              - type: object
                required:
                  - dataset_id
                  - depth_start
                  - depth_end
        results:
          type: array
          description: Per dataset, aggregation area, year window and depth range.
          items:
            allOf:
              - $ref: '#/components/schemas/CorrelationStatistics'
              - type: object
                required:
                  - dataset_id
                  - depth_start
                  - depth_end
                  - unit_id
                  - points_truncated
                  - x
                  - y
                properties:
                  unit_id:
                    type: string
                    format: uuid
                  points_truncated:
                    type: boolean
                    description: >-
                      True when n_points is above max_points: x and y are then a fixed-seed sample
                      of max_points locations, while the statistics still use every point.
                  x:
                    type: array
                    items:
                      type: number
                    description: x[i] and y[i] are one location. The order has no meaning.
                  y:
                    type: array
                    items:
                      type: number
