openapi: 3.0.0
info:
  version: 1.0.0
  title: Data requests
  description: Schemas for the /data-requests endpoints
components:
  schemas:
    DataRequestSubmission:
      type: object
      description: >-
        Payload submitted to POST /data-requests. Which product is computed is chosen by
        statistics_type; the aggregation areas are resolved identically for every type, and only
        what is computed over them differs.
      additionalProperties: false
      required:
        - statistics_type
        - filter_id
      properties:
        statistics_type:
          type: string
          enum: [descriptive, class-distribution, value-range]
          description: >-
            Which product to compute. `descriptive` gives descriptive statistics over the
            matching observations, per aggregation area, dataset, soil property, sampling
            year and depth interval. `class-distribution` gives the percentage or number of one
            soil property's observations in each of the given classes, per dataset, aggregation
            area, year window and depth bucket. `value-range` gives just how many observations
            of one soil property match, at how many locations, and their lowest and highest
            values, for the whole request and per dataset. Required, and never defaulted.
        filter_id:
          type: string
          format: uuid
          description: >-
            Filter supplying the criteria. Also supplies the aggregation areas, unless
            file_id is given — in which case the filter's own geometries are not used.
        file_id:
          type: string
          description: >-
            Optional spatial file whose geometries each become one aggregation area. Must
            be a vector file with a known EPSG code and only polygon or multipolygon
            geometries; a multipolygon counts as one area. The number of geometries is
            capped by server configuration.
        dataset_ids:
          type: array
          items:
            type: string
          description: >-
            Optional list of dataset IDs. When given, preview access to each is enforced
            on submission. When omitted, every dataset the filter matches is used and
            those without preview access are skipped. Which ones were skipped is no longer
            reported back — it reaches the server log only.
        histogram_bins:
          type: integer
          minimum: 2
          maximum: 100
          description: >-
            Number of equal-width histogram bins spanning each cell's min-max range.
            Applies to statistics_type `descriptive` only; sending it with another type is
            a 400.
        variable:
          $ref: '#/components/schemas/ClassDistributionVariable'
        classes:
          type: array
          minItems: 1
          maxItems: 20
          description: >-
            Only accepted with statistics_type `class-distribution`, which needs either this or
            class_count with class_method, never both. The classes the variable's values are
            sorted into, in the order the output reports them. Each class includes its min and
            excludes its max; classes must not overlap (touching bounds are fine), names must be
            unique, and `unclassified` is reserved.
          items:
            $ref: '#/components/schemas/ClassDefinition'
        class_count:
          type: integer
          minimum: 3
          maximum: 20
          description: >-
            Only accepted with statistics_type `class-distribution`, instead of classes: how many
            classes to generate from the matching observations, in total. Requires class_method.
            The classes are generated once for the whole request, each observation counted once,
            so every row shares them; the first is open below and the last open above, so nothing
            is unclassified. Repeated values can yield fewer classes than asked for, never more.
        class_method:
          type: string
          enum: [equal-interval, quantile]
          description: >-
            Required with class_count, and rejected without it. `equal-interval` gives equal-width
            classes over the 1st-99th percentile range, rounded to readable edges (for histograms),
            with anything beyond it in the open first and last class. `quantile` gives each class
            about the same number of observations, with edges rounded to 3 decimals.
        time_aggregation:
          type: integer
          minimum: 1
          maximum: 10
          description: >-
            Only accepted with statistics_type `class-distribution`. Size of each year window, in
            years; windows are aligned to multiples of it (for 3: 2016-2018, 2019-2021), so a year
            always falls in the same window. Defaults to 1, a single calendar year.
        depth_ranges:
          type: string
          enum: [none, standard]
          description: >-
            Only accepted with statistics_type `class-distribution`. `none` (the default) pools
            every depth into one bucket, which mixes horizons. `standard` sorts each observation
            into the GlobalSoilMap range (0-5, 5-15, 15-30, 30-60, 60-100, 100-200 cm, and deeper
            than 200) holding its layer's depth midpoint, so a 0-30 cm composite is reported at
            15-30 cm.
        value_type:
          type: string
          enum: [percentage, count]
          description: >-
            Required for, and only accepted with, statistics_type `class-distribution`: what each
            class value in the output holds. `percentage` is the share of the row's observations,
            rounded to 3 decimals, so a row's values sum to 100; `count` is the number of
            observations, so they sum to the row's count. Never defaulted.
        label_field:
          type: string
          description: >-
            Optional field of file_id whose value labels each aggregation area. Must name
            an existing field of that file.

    DataRequestParameters:
      type: object
      description: >-
        What was asked, plus what resolving it produced. The resolved half is part of the question
        rather than the answer, and is what makes the result interpretable: unit_id in the result
        is an opaque identifier, and units below is the only place its label and area appear.
      required:
        - statistics_type
        - filter_id
        - derived_filter_id
        - unit_count
        - units
      properties:
        statistics_type:
          type: string
          enum: [descriptive, class-distribution, value-range]
        filter_id:
          type: string
          format: uuid
        file_id:
          type: string
        dataset_ids:
          type: array
          items:
            type: string
        histogram_bins:
          type: integer
        variable:
          $ref: '#/components/schemas/ClassDistributionVariable'
        classes:
          type: array
          items:
            $ref: '#/components/schemas/ClassDefinition'
        class_count:
          type: integer
        class_method:
          type: string
          enum: [equal-interval, quantile]
        time_aggregation:
          type: integer
        depth_ranges:
          type: string
          enum: [none, standard]
        value_type:
          type: string
          enum: [percentage, count]
        label_field:
          type: string
        derived_filter_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Filter holding the aggregation areas when they came from file_id; null when they are
            the filter's own geometries.
        unit_count:
          type: integer
          description: Number of aggregation areas resolved.
        units:
          type: array
          items:
            $ref: '#/components/schemas/AggregationUnit'

    AggregationUnit:
      type: object
      description: One aggregation area the statistics are reported for.
      required:
        - unit_id
        - label
        - record_ids
        - area_m2
        - raster_filtered
      properties:
        unit_id:
          type: string
          format: uuid
          description: Identifier this area's statistics are reported under.
        label:
          type: string
          nullable: true
          description: Value of label_field for the source row, when one was given.
        record_ids:
          type: array
          items:
            type: integer
          description: Source rows that resolved to this area — several when the file repeats a geometry.
        area_m2:
          type: number
          nullable: true
        raster_filtered:
          type: boolean
          description: >-
            True when raster filters applied. The area is unchanged by them, so the effective area
            the statistics cover is smaller than area_m2.

    DataRequest:
      type: object
      description: >-
        One data request and the outcome of its run. Progress fields are present only while the
        underlying run still exists; data is present only once the run completed.
      required:
        - id
        - status
        - created_at
        - completed_at
        - message
        - request
      properties:
        id:
          type: string
          format: uuid
          description: >-
            Identifies the request and is the whole of the permission to read or delete it. Treat
            it as a secret: anyone holding it has the same access as whoever submitted the request.
        status:
          type: string
          enum: [pending, running, completed, failed]
        created_at:
          type: string
          format: date-time
          description: When the request was submitted.
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: When the run reached its outcome; null while it is pending or running.
        progress_percentage:
          type: integer
          description: Absent once the underlying run has been removed by retention.
        progress_description:
          type: string
          description: Absent once the underlying run has been removed by retention.
        message:
          type: string
          nullable: true
          description: Why the request failed. Null unless status is `failed`.
        request:
          $ref: '#/components/schemas/DataRequestParameters'
        data:
          description: >-
            The result, whose shape is chosen by request.statistics_type. Absent until the request
            completes, and never present for a failed one.
          oneOf:
            - $ref: '#/components/schemas/SoilStatistics'
            - $ref: '#/components/schemas/ClassDistribution'
            - $ref: '#/components/schemas/ValueRange'

    ValueRangeFigures:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          description: Matching observations, or scores for a soil index; 0 when there are none.
        n_features:
          type: integer
          description: Distinct sampling locations behind count. Absent for a soil index, whose scores have none.
        min:
          type: number
          description: Lowest value, in standard_unit. Absent when count is 0.
        max:
          type: number
          description: Highest value, in standard_unit. Absent when count is 0.

    ValueRange:
      description: >-
        The result of a `value-range` data request. The top-level figures cover the whole request,
        each observation (or score) counted once however many aggregation areas it falls in. For a
        soil property, datasets gives the same figures per dataset, listing only datasets with at
        least one matching observation; for a soil index there is no datasets, since scores belong
        to no dataset.
      allOf:
        - $ref: '#/components/schemas/ValueRangeFigures'
        - type: object
          properties:
            soil_property:
              type: string
              description: Present when variable.type is `soil-property`.
            standard_unit:
              type: string
              nullable: true
              description: Present when variable.type is `soil-property`. The unit values and class bounds are in.
            run:
              type: string
              format: uuid
              description: Present when variable.type is `soil-index`. The soil index run whose scores were read.
            soil_index_type:
              type: string
              description: >-
                Present when variable.type is `soil-index` and the run scored anything. Scores have no
                unit of measure.
            datasets:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/ValueRangeFigures'
                  - type: object
                    required:
                      - dataset_id
                    properties:
                      dataset_id:
                        type: string

    ClassDistributionVariable:
      type: object
      description: >-
        Required for, and only accepted with, statistics_types `class-distribution` and
        `value-range`: what they are computed for. A `soil-property` must exist and be admitted by
        the filter's own soil property criterion, if it has one. A `soil-index` names a completed
        soil index run, whose scores are read in place of observations: each score belongs to the
        areas containing its representative point, the filter must carry no criteria at all (it
        supplies only the area), and dataset_ids and depth_ranges are rejected. Holding the run id
        is the whole of the permission to read its scores.
      additionalProperties: false
      required:
        - type
        - id
      properties:
        type:
          type: string
          enum: [soil-property, soil-index]
        id:
          type: string
          description: ID of the soil property, or the id of the soil index run.

    ClassDefinition:
      type: object
      description: >-
        One class, in the soil property's standard unit. At least one bound is required; an
        absent bound is unbounded on that side.
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        min:
          type: number
          description: Included in the class.
        max:
          type: number
          description: Excluded from the class.

    ClassDistribution:
      type: object
      description: >-
        The result of a `class-distribution` data request: one row per dataset, aggregation area,
        year window and depth bucket that holds any observations. A missing row means no
        observations, never a small or empty one: every row is emitted, however few observations
        it holds, so check count before trusting a distribution.
      required:
        - classes
        - results
      properties:
        soil_property:
          type: string
          description: Present when variable.type is `soil-property`.
        standard_unit:
          type: string
          nullable: true
          description: Present when variable.type is `soil-property`. The unit values and class bounds are in.
        run:
          type: string
          format: uuid
          description: Present when variable.type is `soil-index`. The soil index run whose scores were read.
        soil_index_type:
          type: string
          description: >-
            Present when variable.type is `soil-index` and the run scored anything. Scores have no
            unit of measure.
        classes:
          type: array
          description: >-
            The classes every row's class names refer to, in order: the request's own, or those
            generated from class_count and class_method. Generated classes depend on the data at
            the time of the run, so two runs of the same request can differ. Empty when classes
            were to be generated and no observation matched.
          items:
            $ref: '#/components/schemas/ClassDefinition'
        observed_min:
          type: number
          description: >-
            Lowest observation value across the whole request, for labelling the open first
            class. Absent when no observation matched.
        observed_max:
          type: number
          description: >-
            Highest observation value across the whole request, for labelling the open last
            class. Absent when no observation matched.
        results:
          type: array
          items:
            $ref: '#/components/schemas/ClassDistributionRow'

    ClassDistributionRow:
      type: object
      description: >-
        One distribution, ready to chart. Observations are counted once per area they fall in, so
        an observation inside two overlapping areas counts in both.
      required:
        - unit_id
        - year_start
        - year_end
        - count
        - classes
      properties:
        dataset_id:
          type: string
          description: Absent for a soil index, whose scores belong to no dataset.
        unit_id:
          type: string
          format: uuid
          description: The aggregation area, as reported in request.units.
        year_start:
          type: integer
          nullable: true
          description: First year of the window; null for observations with no recorded year.
        year_end:
          type: integer
          nullable: true
          description: Last year of the window; null for observations with no recorded year.
        depth_start:
          type: integer
          nullable: true
          description: >-
            Present only when depth_ranges is `standard`: the shallow edge of the standard range,
            in cm, included. Null, together with depth_end, for layers with no recorded depth.
        depth_end:
          type: integer
          nullable: true
          description: >-
            Present only when depth_ranges is `standard`: the deep edge of the standard range, in
            cm, excluded. Null on its own for the range deeper than 200 cm.
        depth_min:
          type: integer
          description: >-
            Shallowest depth covered by the layers behind this row, in cm; absent when none
            records a depth. Tells a 15-30 cm row built from 0-30 cm composites apart from true
            15-30 cm samples.
        depth_max:
          type: integer
          description: Deepest depth covered by the layers behind this row, in cm.
        count:
          type: integer
          description: Observations behind this row.
        n_features:
          type: integer
          description: Distinct sampling locations behind count. Absent for a soil index, where count is of scores.
        classes:
          type: array
          description: >-
            Every class of the top-level classes, in order, then `unclassified` when any observation
            fell in no class. Each value is what request.value_type says: the percentage of count in
            the class (rounded to 3 decimals, summing to 100) or the number of observations in it
            (summing to count). Either way the array can be charted as is.
          items:
            type: object
            required:
              - name
              - value
            properties:
              name:
                type: string
              value:
                type: number

    SoilStatistics:
      type: object
      description: >-
        The result of a `descriptive` data request: one group per dataset and soil property.
        Absent until the request completes, and never present for a failed one.
      required:
        - results
        - truncated
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SoilStatisticsGroup'
        truncated:
          type: boolean
          description: >-
            True when at least one group's per-year/per-depth breakdown was dropped to fit the
            output budget. The per-area figures are always complete.

    SoilStatisticsGroup:
      type: object
      required:
        - dataset_id
        - soil_property
        - standard_unit
        - l4_included
        - overall
        - units
      properties:
        dataset_id:
          type: string
        soil_property:
          type: string
        standard_unit:
          type: string
          nullable: true
        l4_included:
          type: boolean
          description: False when this group's per-year/per-depth breakdown was dropped to fit the output budget.
        overall:
          allOf:
            - $ref: '#/components/schemas/SoilStatisticsCell'
          description: >-
            Computed before areas are fanned out, so an observation inside two overlapping areas is
            counted once. It therefore does not equal the sum of the per-area counts.
        units:
          type: array
          items:
            $ref: '#/components/schemas/SoilStatisticsUnit'

    SoilStatisticsCell:
      type: object
      description: >-
        Descriptive statistics over one set of observation values, all in standard_unit. Every
        non-integer statistic is rounded to 3 decimals, and a statistic with no value is absent
        rather than null. Two figures are deliberately left out because they are derivable: the
        interquartile range (p75 - p25) and the coefficient of variation (stddev / |mean|).
      required:
        - count
        - n_features
        - n_layers
        - min
        - max
        - mean
        - median
        - p05
        - p25
        - p75
        - p95
      properties:
        count:
          type: integer
        n_features:
          type: integer
          description: Distinct sampling locations behind count — the sample support.
        n_layers:
          type: integer
        min:
          type: number
        max:
          type: number
        mean:
          type: number
        median:
          type: number
        stddev:
          type: number
          description: Sample standard deviation. Absent when count is below 2.
        p05:
          type: number
        p25:
          type: number
        p75:
          type: number
        p95:
          type: number
        sampling_date_min:
          type: string
        sampling_date_max:
          type: string
        depth_min:
          type: integer
        depth_max:
          type: integer
        horizons:
          type: array
          items:
            type: string
          description: Distinct horizons mixed into this cell. Absent when none are recorded.
        laboratory_methods:
          type: array
          items:
            type: string
          description: >-
            Distinct laboratory methods mixed into this cell — more than one means the summary
            spans methods. Absent when none are recorded.
        histogram:
          $ref: '#/components/schemas/Histogram'

    Histogram:
      type: object
      description: >-
        Bin counts over equal-width bins spanning [min, max]. Absent at or below 100 observations,
        where the bins would describe the sample rather than the distribution. Bin boundaries are
        not transmitted: they are min + i * bin_width, the last being exactly max. A single entry
        in counts — not bin_width being 0 — is the signal that every value in the cell is
        identical, because a genuine width below 0.0005 also rounds to 0.
      required:
        - bin_width
        - counts
      properties:
        bin_width:
          type: number
        counts:
          type: array
          items:
            type: integer

    SoilStatisticsUnit:
      description: One aggregation area's statistics, keyed by the unit_id reported in request.units.
      allOf:
        - $ref: '#/components/schemas/SoilStatisticsCell'
        - type: object
          required:
            - unit_id
          properties:
            unit_id:
              type: string
              format: uuid
            breakdown:
              type: array
              description: >-
                Per sampling year and depth interval. Absent for two different reasons, told apart
                by l4_included on the group: when false the breakdown was dropped to fit the output
                budget; when true this area's observations all fall in one year and depth interval,
                so the single cell would repeat the area's own statistics. Never an empty array.
              items:
                $ref: '#/components/schemas/SoilStatisticsBreakdownCell'

    SoilStatisticsBreakdownCell:
      description: >-
        One (year, depth interval) slice. Unlike the statistics above, nulls here are spelled out
        rather than omitted: a null is the bucket's identity ("no recorded year"), not a value that
        happens to be missing. depth_min and depth_max are dropped because the grouping is by
        min_depth and max_depth, which would repeat them.
      allOf:
        - $ref: '#/components/schemas/SoilStatisticsCell'
        - type: object
          required:
            - year
            - min_depth
            - max_depth
          properties:
            year:
              type: integer
              nullable: true
            min_depth:
              type: integer
              nullable: true
            max_depth:
              type: integer
              nullable: true
