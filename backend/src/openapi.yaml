  /data-requests:
    post:
      x-eov-operation-handler: controllers/data-requests
      x-eov-operation-id: postDataRequest
      x-entitlements-required: true
      summary: Submit a data request
      description: >-
        Starts a run that resolves aggregation areas from a filter and computes the chosen
        statistics_type over them. Returns immediately with status `pending`; poll
        GET /data-requests/{dataRequestId} for progress and for the result. With config_id the
        request is attached to that plugin config item, which must exist and on which the caller
        needs write.
      tags:
        - data-requests
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../src/data-requests.yaml#/components/schemas/DataRequestSubmission'
      responses:
        '201':
          description: Data request accepted
          content:
            application/json:
              schema:
                $ref: '../src/data-requests.yaml#/components/schemas/DataRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /data-requests/{dataRequestId}:
    parameters:
      - name: dataRequestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the data request, as returned by POST /data-requests
    get:
      x-eov-operation-handler: controllers/data-requests
      x-eov-operation-id: getDataRequestById
      summary: Get a data request and its result
      description: >-
        Anyone holding the id may read it, with no token required, unless the request is attached
        to a config item: then read on that item is required, and preview on each private Dataset
        that a dashboard item lists in `datasets`.
      tags:
        - data-requests
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: The data request
          content:
            application/json:
              schema:
                $ref: '../src/data-requests.yaml#/components/schemas/DataRequest'
        '403':
          $ref: '#/components/responses/DashboardDatasetsForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      x-eov-operation-handler: controllers/data-requests
      x-eov-operation-id: deleteDataRequestById
      summary: Delete a data request
      description: >-
        Cancels the run if it is still in progress and permanently deletes the request and its result.
        Anyone holding the id may delete it, unless the request is attached to a config item: then
        write on that item is required.
      tags:
        - data-requests
      security:
        - bearerAuth: []
        - {}
      responses:
        '204':
          description: Data request deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /soil-indexes:
