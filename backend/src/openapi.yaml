          description: Human-readable name
        property_acronym:
          type: string
          description: Abbreviation
        description:
          type: string
          nullable: true
          description: Optional description
        standard_unit:
          type: string
          nullable: true
          description: Standard unit
        property_level:
          type: integer
          nullable: true
          description: Hierarchical level
        parent_property_id:
