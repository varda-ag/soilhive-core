          application/json:
            schema:
              $ref: '#/components/schemas/Entitlements'
      responses:
        '200':
          description: Update successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlements'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configs/{configId}/entitlements:
    get:
      x-eov-operation-handler: controllers/entitlements
      x-eov-operation-id: getConfigEntitlements
      x-plugin-token-denied: true
      x-entitlements-required: true
      summary: Get entitlement grants for a config item
      description: >-
        Requires a privileged caller, or a non-admin caller holding READ or WRITE on the config. A
        caller holding WRITE (or privileged) sees every subject's grants; a caller let in on READ
        alone sees only their own entry plus EVERYONE's, not other subjects' identities.


        Unlike PUT, this has no first-access bypass: on a config id nobody has claimed yet, every
        non-admin caller holds neither READ nor WRITE, so this always 403s. That 403 means
        "unclaimed", not "denied" — a caller intending to self-claim a plugin:{pluginId}:{id} config
        should attempt PUT (which does have the bypass) rather than treat this 403 as final.
      tags:
        - configs
      security:
        - bearerAuth: []
      parameters:
        - name: configId
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier for the configuration
      responses:
        '200':
          description: Entitlement grants for the config item
