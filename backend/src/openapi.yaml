      x-eov-operation-id: postSoilIndex
      x-entitlements-required: true
      summary: Submit a soil index run
      description: >-
        Starts a run that resolves aggregation areas from a filter and scores soil_index_type within
        them. Returns immediately with status `pending`; poll GET /soil-indexes/{runId} for progress
        and the outcome. With config_id the run is attached to that plugin config item, which must
        exist and on which the caller needs write.
      tags:
        - soil-indexes
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../src/soil-indexes.yaml#/components/schemas/SoilIndexSubmission'
      responses:
        '201':
          description: Soil index run accepted
          content:
            application/json:
              schema:
                $ref: '../src/soil-indexes.yaml#/components/schemas/SoilIndexRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /soil-indexes/{runId}:
    parameters:
      - $ref: '#/components/parameters/SoilIndexRunId'
    get:
      x-eov-operation-handler: controllers/soil-indexes
      x-eov-operation-id: getSoilIndexById
      summary: Get a soil index run and its outcome
      description: >-
        Anyone holding the id may read it, with no token required, unless the run is attached to a
        config item: then read on that item is required, and preview on each private Dataset that a
        dashboard item lists in `datasets`. Attaching never protects the run's scores
        and tiles, which stay readable by anyone holding the id.
      tags:
        - soil-indexes
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: The soil index run
          content:
            application/json:
              schema:
                $ref: '../src/soil-indexes.yaml#/components/schemas/SoilIndexRun'
        '403':
          $ref: '#/components/responses/DashboardDatasetsForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      x-eov-operation-handler: controllers/soil-indexes
      x-eov-operation-id: deleteSoilIndexById
      summary: Delete a soil index run
      description: >-
        Cancels the run if it is still in progress, and permanently deletes its record, scores and
        tiles. Tiles a client already cached are not recalled. Anyone holding the id may delete it,
        unless the run is attached to a config item: then write on that item is required. Data
        requests that used the run keep their results.
      tags:
        - soil-indexes
      security:
        - bearerAuth: []
        - {}
      responses:
        '204':
          description: Soil index run deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /soil-indexes/{runId}/tiles:
    parameters:
      - $ref: '#/components/parameters/SoilIndexRunId'
    get:
      x-eov-operation-handler: controllers/soil-indexes
      x-eov-operation-id: getSoilIndexTileJson
      summary: Describe a soil index run's map tiles
      description: >-
        TileJSON 3.0.0 for the run's vector tiles, except that `tiles` holds paths relative to the
        API base URL, which the client prepends. Anyone holding the run id may read it, as with
        the run's scores. Cached for a short time only: the tile paths change when the way tiles
        are produced does.
      tags:
        - soil-indexes
      responses:
        '200':
          description: The run's TileJSON
          content:
            application/json:
              schema:
                $ref: '../src/soil-indexes.yaml#/components/schemas/SoilIndexTileJson'
        '404':
          $ref: '#/components/responses/NotFound'

  /soil-indexes/{runId}/tiles/{version}/{z}/{x}/{y}:
    parameters:
      - $ref: '#/components/parameters/SoilIndexRunId'
      - name: version
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: Tiling version, as listed by the run's TileJSON. Only the current one is served.
      - name: z
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
          maximum: 16
      - name: x
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
      - name: y
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
    get:
      x-eov-operation-handler: controllers/soil-indexes
      x-eov-operation-id: getSoilIndexTile
      summary: Get one map tile of a soil index run
      description: >-
        One Mapbox Vector Tile with a single layer, `scores`. From the run's detail zoom up, each
        feature is one scored geometry with `value` and `year`, and its id is the score's id.
        Below it, each feature is a point summarising the scores of one year whose
        representative point is in one grid cell, placed at their centroid, with `value` (their
        mean), `min`, `max`, `count` and `year`. Absent attributes have no value. Tiles never change, and are sent gzipped to
        clients that accept it.
      tags:
        - soil-indexes
      responses:
        '200':
          description: The tile
          content:
            application/vnd.mapbox-vector-tile:
              schema:
                type: string
                format: binary
        '204':
          description: Nothing in this tile is drawn
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /soil-indexes/{runId}/scores/{scoreId}:
    parameters:
      - $ref: '#/components/parameters/SoilIndexRunId'
      - name: scoreId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
        description: >-
          The score's id, which is its feature id in the run's tiles. A grid cell's feature id is
          above the maximum, since a cell has no score of its own.
    get:
      x-eov-operation-handler: controllers/soil-indexes
      x-eov-operation-id: getSoilIndexScore
      summary: Get one score of a soil index run
      description: >-
        One scored geometry's value, year and methodology metadata, for example to show on hover.
        Anyone holding the run id may read it. Never changes.
      tags:
        - soil-indexes
      responses:
        '200':
          description: The score
          content:
            application/json:
              schema:
                $ref: '../src/soil-indexes.yaml#/components/schemas/SoilIndexScore'
        '404':
          $ref: '#/components/responses/NotFound'

  /datasets/{datasetId}/dataset-file-mapping:
    get:
      x-eov-operation-handler: controllers/dataset-file-mappings
      x-eov-operation-id: getDatasetFileMappings
      summary: Get all dataset file mappings for a dataset
      tags:
        - datasets
      security:
        - bearerAuth: [super-admin, data-admin]
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
          description: Dataset ID
        - name: fileId
          in: query
          required: false
          schema:
            type: string
          description: Optional file ID to filter mappings
      responses:
        '200':
          description: List of dataset file mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetFileMappingResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      x-eov-operation-handler: controllers/dataset-file-mappings
      x-eov-operation-id: createDatasetFileMapping
      summary: Creates a dataset-file-mapping triplet (or placeholder)
      tags:
        - datasets
      security:
        - bearerAuth: [super-admin, data-admin]
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetFileMappingRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetFileMappingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Unauthorized - Token subject is missing
        '409':
          description: The dataset has a bulk-load, raster-load or bulk-delete job queued or running, or the file is the source of a raster filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      x-eov-operation-handler: controllers/dataset-file-mappings
      x-eov-operation-id: deleteDatasetFileMappingByFileId
      summary: Delete a dataset file mapping by file ID
      description: >
        Removes a file from the dataset. When the file is a loaded raster, its raster layers stay until
        the next raster-load job for the dataset deletes them, along with their footprints, additional
        resources and group memberships, and rolls the dataset's metadata up again. Delete the file too
        (DELETE /files/{fileId}) to hide its layers from reads straight away. A loaded vector file
        can't be removed, since its observations don't record which file they came from.
      tags:
        - datasets
      security:
        - bearerAuth: [super-admin, data-admin]
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
          description: Dataset ID
        - name: fileId
          in: query
          required: true
          schema:
            type: string
          description: File ID whose mapping should be deleted
      responses:
        '204':
          description: Dataset file mapping deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The dataset has a bulk-load, raster-load or bulk-delete job queued or running, or the file is a loaded vector file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /datasets/{datasetId}/dataset-file-mapping/{datasetFileMappingId}:
    get:
      x-eov-operation-handler: controllers/dataset-file-mappings
      x-eov-operation-id: getDatasetFileMapping
      summary: Get a specific dataset file mapping
      tags:
        - datasets
      security:
        - bearerAuth: [super-admin, data-admin]
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
          description: Dataset ID
        - name: datasetFileMappingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
