      x-eov-operation-id: updateDatasetFileMapping
      summary: Updates a dataset-file-mapping triplet (or placeholder)
      tags:
        - datasets
      security:
        - bearerAuth: [super-admin, data-admin]
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
        - name: datasetFileMappingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetFileMappingRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetFileMappingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Unauthorized - Token subject is missing
        '409':
          description: The dataset has a bulk-load, raster-load or bulk-delete job queued or running, the file is the source of a raster filter, or the file is loaded and the mapping's content changes
          content:
            application/json:
              schema:
