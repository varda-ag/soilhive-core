          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The file isn't staged, so it has no raw records to count (it's loaded, or not processed yet)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /datasets/{datasetId}/dataset-file-mapping/{datasetFileMappingId}/soil-data/stats:
    parameters:
      - name: datasetId
        in: path
        required: true
        schema:
          type: string
        description: ID of the dataset containing soil data
      - name: datasetFileMappingId
        in: path
        required: true
        schema:
          type: string
        description: Unique identifier of the mapping related to the raw record
    get:
      x-eov-operation-handler: controllers/datasets
      x-eov-operation-id: getSoilDataStats
      summary: Returns the summary of cleaned cells/rows applied to the raw data
      tags:
        - datasets
      security:
        - bearerAuth: [super-admin, data-admin]
      responses:
        '200':
          description: Cleaning summary retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleaningReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The file isn't staged, so it has no raw records to summarise (it's loaded, or not processed yet)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /datasets/{datasetId}/dataset-file-mapping/{datasetFileMappingId}/soil-data:
    parameters:
      - name: datasetId
        in: path
        required: true
        schema:
          type: string
        description: ID of the dataset containing soil data
      - name: datasetFileMappingId
        in: path
        required: true
        schema:
          type: string
        description: Unique identifier of the mapping related to the raw record
    post:
      x-eov-operation-handler: controllers/datasets
      x-eov-operation-id: postSoilData
      summary: Loads soil data records into the system
      tags:
        - datasets
      security:
        - bearerAuth: [super-admin, data-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SoilRecord'
      responses:
        '201':
          description: Soil data loaded successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The dataset has a bulk-load, raster-load or bulk-delete job queued or running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      x-eov-operation-handler: controllers/datasets
      x-eov-operation-id: getSoilData
      summary: Retrieve soil data records before loading them into the system
      tags:
        - datasets
      security:
        - bearerAuth: [super-admin, data-admin]
      parameters:
        - in: query
          name: limit
          required: true
          description: Number of items in the response
          schema:
            type: number
            default: 100
            minimum: 1
            maximum: 200
        - in: query
          name: cursor
          required: false
          description: Pagination cursor
          schema:
            type: string
        - in: query
          name: sort
          required: false
          description: Sort column. Prepend with '-' for descending order
          schema:
            type: string
      responses:
        '200':
          description: Soil data retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/SoilRecord'
                    - type: object
                      required:
                        - cursor
                        - record_id
                      properties:
                        cursor:
                          type: string
                          description: >
                            Base64-encoded keyset cursor for this record.
                            Pass the cursor from the last record as the `cursor`
                            query param to retrieve the next page.
                        record_id:
                          type: number
                          description: >
                            Row unique identifier (integer). Used to reference records to drop.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The file isn't staged, so it has no raw records to preview (it's loaded, or not processed yet)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /files:
    post:
      x-eov-operation-handler: controllers/files
      x-eov-operation-id: createFile
      summary: Create a file to load (upload, create entity and extract metadata)
      tags:
        - files
      security:
        - bearerAuth: [super-admin, data-admin]
      parameters:
        - in: query
          name: spatial
          required: false
          description: Whether the upload is a spatial file.
          schema:
            type: boolean
            default: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDescriptor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /files/{fileId}:
    parameters:
      - name: fileId
        in: path
        required: true
        schema:
          type: string
        description: File unique internal identifier
    get:
      x-eov-operation-handler: controllers/files
      x-eov-operation-id: getFile
      summary: Get information for a given file
      tags:
        - files
      security:
        - bearerAuth: [super-admin, data-admin]
      responses:
        '200':
          description: File retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDescriptor'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      x-eov-operation-handler: controllers/files
      x-eov-operation-id: updateFile
      summary: Update information for a given file
      tags:
        - files
      security:
        - bearerAuth: [super-admin, data-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileUpdatePayload'
      responses:
        '200':
          description: File updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDescriptor'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      x-eov-operation-handler: controllers/files
      x-eov-operation-id: deleteFile
      summary: Delete a file
      description: >
        Soft-deletes a file. When it is a loaded raster, reads stop serving its raster layers straight
        away, and the next raster-load job of each dataset it is mapped to deletes them, along with
        their footprints, additional resources and group memberships, and rolls the dataset's
        metadata up again. Refused with 409 while one of those datasets has a load or purge queued or
        running. A loaded vector file can't be deleted, since its observations don't record which
        file they came from.
      tags:
        - files
      security:
        - bearerAuth: [super-admin, data-admin]
      responses:
        '204':
          description: File deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >
            The file is the source of a raster filter, which owns it until installed; or it is a
            loaded vector file; or a dataset it is mapped to has a bulk-load, raster-load or
            bulk-delete job queued or running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /files/{fileId}/download:
    parameters:
      - name: fileId
        in: path
        required: true
        schema:
          type: string
        description: File unique internal identifier
    get:
      x-eov-operation-handler: controllers/files
      x-eov-operation-id: fileDownload
      x-plugin-token-denied: true
      summary: Download a file
      tags:
        - files
      security:
        - bearerAuth: [super-admin, data-admin]
      responses:
        '200':
          description: File downloaded successfully
        '404':
          $ref: '#/components/responses/NotFound'

  /files/{fileId}/measurement-types:
    parameters:
      - name: fileId
        in: path
        required: true
        schema:
          type: string
        description: File unique internal identifier
    get:
      x-eov-operation-handler: controllers/files
      x-eov-operation-id: getMeasurementTypes
      x-plugin-token-denied: true
      summary: List the measurement types of a long file
      description: >
        Lists the measurement types found in a long file (one row per measured value) that the
        long-stage job has staged: one per combination of the values of the role columns given
        here, with suggested answers for the mapping. Ask again whenever a role column changes;
        the file itself is not read again. Rows with no value are not counted, and with a property
        column neither are rows with no property code.
      tags:
        - files
      security:
        - bearerAuth: [super-admin, data-admin]
      parameters:
        - name: value_col
          in: query
          required: true
          schema:
            type: string
          description: Column holding the measured value
        - name: property_col
          in: query
          schema:
            type: string
          description: Column holding the file's own property code. Give this or fixed_property_id.
        - name: fixed_property_id
          in: query
          schema:
            type: string
          description: >
            Slug of the soil property of the whole file, for a file with no property column. Units
            are then matched against the unit conversions of this property.
        - name: unit_col
          in: query
          schema:
            type: string
          description: Column holding the file's own unit
        - name: method_code_col
          in: query
          schema:
            type: string
          description: Column holding a method code of the file's own
        - name: technique_col
          in: query
          schema:
            type: string
          description: Column holding the file's own technique values
        - name: sample_pretreatment_col
          in: query
          schema:
            type: string
          description: Column holding the file's own sample pretreatment values
        - name: laboratory_method_col
          in: query
          schema:
            type: string
          description: Column holding the file's own laboratory method values
        - name: extractant_concentration_col
          in: query
          schema:
            type: string
          description: Column holding the file's own extractant concentration values
        - name: extraction_ratio_col
          in: query
          schema:
            type: string
          description: Column holding the file's own extraction ratio values
        - name: extraction_base_col
          in: query
          schema:
            type: string
          description: Column holding the file's own extraction base values
        - name: measurement_procedure_col
          in: query
          schema:
            type: string
          description: Column holding the file's own measurement procedure values
        - name: limit_of_detection_col
          in: query
          schema:
            type: string
          description: Column holding the file's own limit of detection values
      responses:
        '200':
          description: Measurement types retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - measurement_types
                properties:
                  measurement_types:
                    type: array
                    items:
                      $ref: '#/components/schemas/FoundMeasurementType'
        '400':
          description: A column given is not a column of the file; or both or neither of property_col and fixed_property_id were given; or the file is not a vector file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The file does not exist, or it has not been staged as a long file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A long-stage job of the file is queued or running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            The file has more measurement types than a mapping can hold. The body carries the code
            FTD_LONG_TOO_MANY_MEASUREMENT_TYPES and the actions to take.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /mappings:
    post:
      x-eov-operation-handler: controllers/mappings
      x-eov-operation-id: createDataMapping
      summary: Create a new data mapping. This operation is idempotent
      description: >
        Refused with 400 when two columns are mapped the same way: to the same soil property,
        procedure and unit conversion. A band mapping of a raster file is not checked for this.
      tags:
        - mappings
      security:
        - bearerAuth: [super-admin, data-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataMappingObject'
      responses:
        '201':
          description: Data mapping created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataMapping'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /mappings/{mappingId}:
    parameters:
      - name: mappingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Data mapping ID
    get:
      x-eov-operation-handler: controllers/mappings
      x-eov-operation-id: getDataMapping
      summary: Get a specific data mapping
      tags:
        - mappings
      security:
        - bearerAuth: [super-admin, data-admin]
      responses:
        '200':
          description: Data mapping retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataMapping'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      x-eov-operation-handler: controllers/mappings
      x-eov-operation-id: deleteDataMapping
      summary: Delete mapping item
      tags:
        - mappings
      security:
        - bearerAuth: [super-admin, data-admin]
      responses:
        '204':
          description: Mapping deleted successfully
  /downloads/{filePath}:
    get:
      x-eov-operation-handler: controllers/files
      x-eov-operation-id: download
      summary: Download a file with temporary access token
      tags:
        - files
      parameters:
        - in: query
          name: token
          required: true
          description: Temporary access token to download access-protected files
          schema:
            type: string
        - in: query
          name: filename
          required: false
          description: Override the Content-Disposition filename sent to the browser
          schema:
            type: string
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: File path. Folder separators should be encoded as %2F
      responses:
        '200':
          description: File downloaded successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'

  /raster-filters:
    get:
      x-eov-operation-handler: controllers/raster-filters
      x-eov-operation-id: getRasterFilters
      summary: Get raster filters
      description: >-
        A caller without the data-admin or super-admin scope is shown only the raster filters that are both
        active and enabled, without their install details.
      tags:
        - raster-filters
      responses:
        '200':
          description: Array of raster filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RasterFilter'
    post:
      x-eov-operation-handler: controllers/raster-filters
      x-eov-operation-id: createRasterFilter
      summary: Create a raster filter and install it from an uploaded raster file
      description: >-
        Upload the raster first with POST /files. Creating the raster filter enqueues its installation,
        followed through `install` on GET /raster-filters/{rasterFilterId}. One band of the file is
        installed, and the file is deleted once the installation succeeds. The raster filter is created
        inactive and unlabelled: label it with PUT /raster-filters/{rasterFilterId}/mappings, then
        activate it with PATCH.
      tags:
        - raster-filters
      security:
        - bearerAuth: [super-admin, data-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RasterFilterCreatePayload'
      responses:
        '201':
          description: Raster filter created and its installation queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RasterFilter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The file is already used by a dataset or another raster filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /raster-filters/{rasterFilterId}:
    parameters:
      - name: rasterFilterId
        in: path
        required: true
        schema:
          type: string
        description: Raster filter ID
    get:
      x-eov-operation-handler: controllers/raster-filters
      x-eov-operation-id: getRasterFilter
      summary: Get raster filter by ID
      description: >-
        Not found for a caller without the data-admin or super-admin scope unless the raster filter is
        both active and enabled.
      tags:
        - raster-filters
      responses:
        '200':
          description: Raster filter information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RasterFilter'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      x-eov-operation-handler: controllers/raster-filters
      x-eov-operation-id: patchRasterFilter
      summary: Update a raster filter's active status, name or description
      tags:
        - raster-filters
      security:
        - bearerAuth: [super-admin, data-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RasterFilterPatchPayload'
      responses:
        '200':
          description: Raster filter updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RasterFilter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      x-eov-operation-handler: controllers/raster-filters
      x-eov-operation-id: deleteRasterFilter
      summary: Delete a raster filter and drop its tables
      description: >-
        Refused while the raster filter is active, so deactivate it first, and while its installation is
        queued or running. Filters saved with its values keep them, but they no longer apply. Its id is
        never reissued: a new raster filter of the same name gets a suffixed one.
      tags:
        - raster-filters
      security:
        - bearerAuth: [super-admin, data-admin]
      responses:
        '204':
          description: Raster filter deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The raster filter is active, its installation is unfinished, or a query is still reading its tables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /raster-filters/{rasterFilterId}/mappings:
    parameters:
      - name: rasterFilterId
        in: path
        required: true
        schema:
          type: string
        description: Raster filter ID
    put:
      x-eov-operation-handler: controllers/raster-filters
      x-eov-operation-id: putRasterFilterMappings
      summary: Replace a raster filter's labels
      description: >-
        Labels pixel values of the installed raster (see `pixel_values`); several values may share a label. A
        raster filter is enabled once it has labels; an empty object removes them all and disables it.
      tags:
        - raster-filters
      security:
        - bearerAuth: [super-admin, data-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RasterFilterMappings'
      responses:
        '200':
          description: Labels replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RasterFilter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The raster filter is not installed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    SoilIndexRunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID of a soil index run, which is the id of the job that ran it
  responses:
    NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DashboardDatasetsForbidden:
      description: >-
        Forbidden. When the config item is a dashboard and the caller holds the needed config grant
        but lacks access to its Datasets, the body also has `datasets` and `has_unavailable_datasets`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DashboardDatasetsForbidden'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Unprocessable entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Gone:
      description: The requested resource is no longer available
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DatasetError:
      type: object
      required:
        - dataset_id
        - errors
      properties:
        dataset_id:
          type: string
          description: The dataset's slug, as carried on the failed job's data.
        errors:
          type: array
          items:
            type: object
            required:
              - code
              - message
              - actions
            properties:
              code:
                type: string
              message:
                type: string
              actions:
                type: array
                items:
                  type: string
              params:
                type: object
                additionalProperties: true
              detail:
                type: string
                nullable: true

    PublicStorageConfig:
      type: object
      required:
        - storageMode
        - maxUploadSizeMB
      properties:
        storageMode:
          type: string
          description: Configured storage mode
        maxUploadSizeMB:
          type: number
          description: Maximum upload size, in megabytes, enforced on file uploads

    AuthConfig:
      type: object
      required:
        - authMode
      properties:
        authMode:
          type: string
          description: Authentication mode type
        oidcConfig:
          $ref: '#/components/schemas/OIDCConfig'

    OIDCConfig:
      type: object
      required:
        - authority
        - clientId
        - redirectUri
        - postLogoutRedirectUri
        - silentRedirectUri
        - scope
      properties:
        authority:
          type: string
        clientId:
          type: string
        redirectUri:
          type: string
        postLogoutRedirectUri:
          type: string
        silentRedirectUri:
          type: string
        scope:
          type: string

    Jwks:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            type: object
            required:
              - kty
              - crv
              - x
              - y
              - kid
              - use
              - alg
            properties:
              kty:
                type: string
                enum: [EC]
              crv:
                type: string
                enum: [P-256]
              x:
                type: string
              y:
                type: string
              kid:
                type: string
                description: RFC 7638 thumbprint of the key
              use:
                type: string
                enum: [sig]
              alg:
                type: string
                enum: [ES256]

    ConfigItem:
      type: object

    DashboardDatasetsForbidden:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            datasets:
              type: array
              items:
                type: string
              description: Current slugs of the private Datasets the caller needs `preview` on.
              example: ['ds-x']
            has_unavailable_datasets:
              type: boolean
              description: True when a listed Dataset is unpublished, deleted or unknown. Its id is not given.

    ErrorResponse:
      type: object
      required:
        - title
        - status
        - detail
        - instance
      properties:
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          example: 'Not Found'
        status:
          type: integer
          description: The HTTP status code
          example: 404
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          example: 'The requested configuration resource was not found.'
        instance:
          type: string
          format: uri
          description: A URI reference that identifies the specific occurrence of the problem. It may yield further information if dereferenced.

    Geometry:
      $ref: '../src/GeoJSON-OAS3.yaml#/components/schemas/Geometry'

    RasterBandMetadata:
      type: object
      properties:
        band_number:
          type: integer
        data_type:
          type: string
        min_value:
          type: number
        max_value:
          type: number
        no_data_value:
          type: number
        overviews:
          type: array
          description: '[width, height] pairs, in pixels'
          items:
            type: array
            items:
              type: number
            minItems: 2
            maxItems: 2
        category_labels:
          type: object
          additionalProperties:
            type: string
          description: >-
            Pixel value → label, read from the band's raster attribute table, else its category names, else a
            CLASSES metadata item holding that JSON (the file's own counts for a single-band file only). Absent
            when the band carries none.
      required:
        - band_number
        - data_type

    RasterFileMetadata:
      type: object
      description: Metadata for raster files
      properties:
        is_raster:
          type: boolean
          enum: [true]
        driver:
          type: string
        epsg:
          type: integer
        crs_source:
          $ref: '#/components/schemas/CrsSource'
        georeference:
          $ref: '#/components/schemas/Georeference'
        georeference_wgs84:
          $ref: '#/components/schemas/GeoreferenceWgs84'
        size:
          type: array
          description: '[width, height] in pixels'
          items:
            type: number
          minItems: 2
          maxItems: 2
        band_count:
          type: integer
        raster_bands:
          type: array
          items:
            $ref: '#/components/schemas/RasterBandMetadata'
      required:
        - is_raster
        - size
        - band_count
        - raster_bands

    VectorFileMetadata:
      type: object
      description: Metadata for vector files
      properties:
        is_raster:
          type: boolean
          enum: [false]
        detected_fields:
          type: object
          additionalProperties: true
        detected_mapping:
          type: object
          additionalProperties: true
        detected_format:
          type: string
          enum: [wide, long]
          description: >
            Suggested from the first rows of the file. wide: one column per property. long: one row per
            measured value. Absent on older files, which read as wide. A long file must be staged by a
            long-stage job (POST /jobs) before its measurement types can be listed.
        detected_long_roles:
          type: object
          description: The suggested role columns of a long file. Only when detected_format is long.
          properties:
            property_col:
              type: string
              nullable: true
              description: null when the file names no property, so one is set for the whole file
            value_col:
              type: string
              nullable: true
            unit_col:
              type: string
              nullable: true
            method_code_col:
              type: string
              nullable: true
            procedure_cols:
              type: object
              description: Procedure field to the column holding it
              additionalProperties:
                type: string
        long_format_stats:
          $ref: '#/components/schemas/LongFormatStats'
        field_names:
          type: array
          items:
            type: string
        geometry_detected:
          type: boolean
        driver:
          type: string
        epsg:
          type: integer
        crs_source:
          $ref: '#/components/schemas/CrsSource'
        georeference:
          $ref: '#/components/schemas/Georeference'
        georeference_wgs84:
          $ref: '#/components/schemas/GeoreferenceWgs84'

    CrsSource:
      type: string
      enum: [inferred, supplied]
      description: Whether epsg came from the file or from the data admin. Absent on older files, which read as inferred.

    Georeference:
      type: array
      nullable: true
      description: Four [x, y] corners in the file's own CRS, upper-left first, clockwise. Null when the file has none; absent on files extracted before it existed.
      items:
        type: array
        items:
          type: number
        minItems: 2
        maxItems: 2
      minItems: 4
      maxItems: 4

    GeoreferenceWgs84:
      type: array
      description: The georeference as [lon, lat] in EPSG:4326. Absent while the CRS is unknown or when a corner does not reproject.
      items:
        type: array
        items:
          type: number
        minItems: 2
        maxItems: 2
      minItems: 4
      maxItems: 4

    FilterGeometry:
      type: object
      description: One stored filter geometry — one Aggregation Unit of data-requests output.
      properties:
        type:
          type: string
          enum: [Feature]
        id:
          type: string
          format: uuid
          description: Geometry identifier, referenced as unit_id in data-requests output
        geometry:
          $ref: '#/components/schemas/Geometry'
        properties:
          type: object
          properties:
            area_m2:
              type: number
              nullable: true
              description: Area of the whole geometry in m². Raster filters do not reduce it, so it overstates the area the statistics cover whenever they are applied.
      required:
        - type
        - id
        - geometry

    FilterGeometryCollection:
      type: object
      description: Cursor-paginated GeoJSON FeatureCollection; total, limit and next_cursor are GeoJSON foreign members.
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        total:
          type: integer
          description: Total number of geometries on the filter, ignoring pagination
        limit:
          type: integer
        next_cursor:
          type: string
          nullable: true
          description: Pass as `cursor` to fetch the next page. Null on the last page.
        features:
          type: array
          items:
            $ref: '#/components/schemas/FilterGeometry'
      required:
        - type
        - total
        - next_cursor
        - features

    FileDescriptor:
      type: object
      properties:
        id:
          type: string
          description: Unique file identifier
        name:
          type: string
          description: File name
        file_path:
          type: string
          description: Storage key (path-like)
        status:
          type: string
          readOnly: true
        metadata:
          description: Spatial file fields, CRS and geometry information
          oneOf:
            - $ref: '#/components/schemas/RasterFileMetadata'
            - $ref: '#/components/schemas/VectorFileMetadata'
          discriminator:
            propertyName: is_raster
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          readOnly: true
        updated_by:
          type: string
          readOnly: true
      required:
        - id
        - name
        - created_at
        - created_by

    FileUpdatePayload:
      type: object
      properties:
        epsg:
          type: number
          description: EPSG code of the spatial file

    FilterCriteria:
      type: object
      properties:
        data_types:
          type: array
          items:
            type: string
            enum:
              - point
              - polygonal
              - raster
            description: Type of data contained in the dataset (e.g., point samples, raster data)
        licenses:
          type: array
          items:
            type: string
        # An explicit null matches data where the value is unset (e.g. min_depth: null
        # matches layers without a depth), while an absent key means "no constraint".
        # A bounded value matches a layer with no recorded value on its dataset's instead
        # (licenses too); see the Dataset fallback in CONTEXT.md and ADR 0058.
        min_sampling_date:
          type: string
          pattern: '^\d{4}(-\d{2}){0,2}$'
          nullable: true
        max_sampling_date:
          type: string
          pattern: '^\d{4}(-\d{2}){0,2}$'
          nullable: true
        min_depth:
          type: number
          nullable: true
        max_depth:
          type: number
          nullable: true
        horizons:
          type: array
          items:
            type: string
            nullable: true
        soil_properties:
          type: array
          items:
            type: string
        raster_filters:
          type: object
          additionalProperties:
            type: array
            items:
              type: number
        visibility:
          type: string
          enum: [public, private]

    DataFilter:
      type: object
      properties:
        geometries:
          type: array
          items:
            $ref: '#/components/schemas/Geometry'
        parameters:
          $ref: '#/components/schemas/FilterCriteria'
      required:
        - geometries
        - parameters

    FilteredDataset:
      type: object
      properties:
        id:
          type: string
          description: Dataset identifier
        name:
          type: string
          description: Dataset name
        data_type:
          type: string
          enum:
            - point
            - polygonal
            - raster
          description: Type of data contained in the dataset (e.g., point samples, raster data)
        visibility:
          type: string
          enum: [public, private]
          default: private
        status:
          type: string
          enum: [PUBLISHED, LOADED]
          description: >-
            The dataset's ingestion status. LOADED only for a data-admin, super-admin or
            internal-request caller, who is shown loaded datasets not yet published, dataset versions
            included; PUBLISHED for everyone else.

    FilteredDatasetSummary:
      allOf:
        - $ref: '#/components/schemas/FilterCriteria'
        - type: object
          properties:
            id:
              type: string
              description: Dataset identifier
            name:
              type: string
              description: Human-readable dataset name
            data_type:
              type: string
              enum:
                - point
                - polygonal
                - raster
              description: Type of data contained in the dataset (e.g., point samples, raster data)
            visibility:
              type: string
              enum: [public, private]
              description: Dataset visibility
            status:
              type: string
              enum: [PUBLISHED, LOADED]
              description: >-
                The dataset's ingestion status. LOADED only for a data-admin, super-admin or
                internal-request caller, who is shown loaded datasets not yet published, dataset
                versions included; PUBLISHED for everyone else.
            dataset_layer_count:
              type: integer
              description: Number of features matching the filter in this dataset
          required:
            - id
            - name
            - visibility
            - dataset_layer_count

    StoredDataFilter:
      type: object
      properties:
        id:
          type: string
          description: Filter identifier
        name:
          type: string
          description: Human readable name for the filter
        filter:
          $ref: '#/components/schemas/DataFilter'

    FilteredDatasetsList:
      type: array
      items:
        $ref: '#/components/schemas/FilteredDatasetSummary'

    FilteredData:
      type: object
      properties:
        datasets:
          $ref: '#/components/schemas/FilteredDatasetsList'
        raster_filters:
          type: object
          additionalProperties:
            type: array
            items:
              type: number

    SoilDataSample:
      type: object
      properties:
        id:
          type: string
          description: >-
            Unique identifier for the soil data sample. For a raster row it identifies the Raster
            Layer and the pixel; like every id it is opaque and must not be parsed.
        dataset_id:
          type: string
          description: Dataset identifier
        dataset_name:
          type: string
          description: Human-readable dataset name
        gis_datatype:
          type: string
          enum:
            - point
            - polygonal
            - raster
          description: >-
            The data type of the dataset the row comes from. `raster` rows are pixels of a Raster
            Layer; the others are Observations.
        soil_property:
          type: string
          description: Slug of the soil property measured, its `id` in `GET /soil-properties`
        property_acronym:
          type: string
          description: Acronym or shorthand for the soil property
        property_name:
          type: string
          description: Full name of the soil property measured
        standard_unit:
          type: string
          description: Standard unit of measurement for the value
        value:
          type: number
          description: Measured numerical value. For a raster row, the pixel value, in the soil property's standard unit.
        value_label:
          type: string
          nullable: true
          description: Class label of the value when the soil property is categorical (e.g. USDA texture 1 = Clay), otherwise null
        geometry:
          type: object
          description: >-
            Spatial representation of the sample location, as GeoJSON in EPSG:4326. For a raster row,
            the outline of the pixel as a Polygon (reprojected from the raster's own CRS); a Point at
            the pixel centre only when the outline cannot be reprojected (a corner falls in a gap of
            an interrupted projection).
        license_name:
          type: string
          description: Name of the data license. For a raster row, the dataset's (first) license.
        sampling_date:
          anyOf:
            - type: string
              format: date
              nullable: true
            - type: string
              pattern: '^\d{4}(-\d{2}){0,2}$'
              nullable: true
          description: >-
            Sampling date, if available. Always null for a raster row, whose period is in
            `reference_period_start` and `reference_period_stop` instead.
        min_depth:
          type: number
          nullable: true
          description: Minimum sampling depth in centimeters. For a raster row, the Raster Layer's.
        max_depth:
          type: number
          nullable: true
          description: Maximum sampling depth in centimeters. For a raster row, the Raster Layer's.
        resolution_m:
          type: number
          nullable: true
          description: >-
            Raster rows only: the Raster Layer's pixel size in metres. Null on vector rows, and on a
            raster row whose resolution could not be measured at ingest.
        reference_period_start:
          type: string
          pattern: '^\d{4}(-\d{2}){0,2}$'
          nullable: true
          description: >-
            Raster rows only: the start of the period the Raster Layer represents, as YYYY, YYYY-MM or
            YYYY-MM-DD. Null on vector rows, and when the Raster Layer has none.
        reference_period_stop:
          type: string
          pattern: '^\d{4}(-\d{2}){0,2}$'
          nullable: true
          description: >-
            Raster rows only: the end of the period the Raster Layer represents, as YYYY, YYYY-MM or
            YYYY-MM-DD. Null on vector rows, and when the Raster Layer has none.
        sample_pretreatment:
          type: string
          nullable: true
          description: Pretreatment applied before analysis
        technique:
          type: string
          nullable: true
          description: Analytical or experimental technique used
        laboratory_method:
          type: string
          nullable: true
          description: The named laboratory method or protocol used to generate the result, including standard protocols or digestion/combustion approaches where applicable
        extractant_concentration:
          type: string
          nullable: true
          description: Extractant concentration details
        extraction_ratio:
          type: string
          nullable: true
          description: Ratio of sample to extractant used
        extraction_base:
          type: string
          nullable: true
          description: Base or solvent used in extraction
        measurement_procedure:
          type: string
          nullable: true
          description: Measurement procedure or instrument used for analysis
        limit_of_detection:
          type: string
          nullable: true
          description: Limit of detection for the measurement
        cursor:
          type: string
          description: Cursor for pagination or sequential retrieval
      required:
        - id
        - dataset_id
        - dataset_name
        - gis_datatype
        - soil_property
        - property_acronym
        - standard_unit
        - value
        - geometry
        - license_name
        - resolution_m
        - reference_period_start
        - reference_period_stop
        - cursor

    MeasuredProperty:
      type: object
      properties:
        soil_property_id:
          type: string
        procedure_id:
          type: string

    CreateLicenseInput:
      allOf:
        - $ref: '#/components/schemas/License'
      required:
        - name

    CreateDatasetInput:
      allOf:
        - $ref: '#/components/schemas/Dataset'
      required:
        - name

    Dataset:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: The dataset's slug. Responses never expose the primary key for an entity that has a slug.
        name:
          type: string
        full_name:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        author:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        data_producer:
          type: string
          nullable: true
        measured_properties:
          type: array
          items:
            $ref: '#/components/schemas/MeasuredProperty'
          readOnly: true
        spatial_resolution:
          type: string
          nullable: true
        publication_date:
          type: string
          pattern: '^\d{4}(-\d{2}){0,2}$'
          nullable: true
        reference_period_start:
          type: string
          pattern: '^\d{4}(-\d{2}){0,2}$'
          nullable: true
        reference_period_stop:
          type: string
          pattern: '^\d{4}(-\d{2}){0,2}$'
          nullable: true
        licenses:
          type: array
          items:
            type: string
          nullable: true
        citation:
          type: string
          nullable: true
        geographical_extent:
          type: string
          nullable: true
        gis_datatype:
          type: string
          nullable: true
        spatial_extent:
          type: object
          nullable: true
          description: >-
            The rectangle the Dataset's data lies within, in EPSG:4326, as a GeoJSON Polygon. For a
            raster Dataset with a Raster Layer crossing the antimeridian, it spans the whole band of
            longitude (-180 to 180) between that layer's south and north edges, not only the longitudes
            the data covers. To show the Dataset on a map, use bbox.
          # TODO: this triggers an OpenApiValidator bug
          # $ref: "../src/GeoJSON-OAS3.yaml#/components/schemas/Polygon"
        bbox:
          type: array
          nullable: true
          readOnly: true
          description: >-
            The Dataset's bounding box, [west, south, east, north] in EPSG:4326, with west > east when
            it crosses the antimeridian (RFC 7946). Null exactly when spatial_extent is. Returned by GET
            /datasets and GET /datasets/{datasetId}. For a raster Dataset, the narrowest box around its
            raster files, which may cross the antimeridian even when none of them does; a file crossing
            it counts as its stored extent until the Dataset is loaded again after this field existed.
            For any other Dataset, spatial_extent's own corners: it never crosses the antimeridian.
          items:
            type: number
          minItems: 4
          maxItems: 4
        n_observations:
          type: string
          nullable: true
        n_raster_layers:
          type: integer
          nullable: true
        soil_depth:
          type: object
          nullable: true
        status:
          type: string
          enum: [PUBLISHED]
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          readOnly: true
        updated_by:
          type: string
          readOnly: true
        service_location:
          type: string
          nullable: true
        visibility:
          type: string
          enum: [public, private]
          default: private
        allow_access_requests:
          type: boolean
          # No `default`: the validator would write it into every PATCH that leaves this out
          description: >-
            Whether new Access Requests may name it, false on a new dataset. Only a private, published
            dataset can be asked for either way. Turning it off leaves pending requests decidable.
        capabilities:
          type: array
          items:
            type: string
            enum: [preview, download, obfuscate_as_points, obfuscate_as_polygons]
          readOnly: true
        inferred_properties:
          type: array
          items:
            type: string
          nullable: true
          readOnly: true
        preprocessing_steps:
          type: string
          nullable: true
        related_resources:
          type: array
          items:
            type: string
            format: uri
          nullable: true
        queued_job:
          type: object
          nullable: true
          readOnly: true
          description: >-
            The bulk-load, raster-load, bulk-delete, version-reset or version-discard job pg-boss has not
            picked up yet, or null. A version-publish locks the dataset it publishes into but isn't its
            queued_job: it shows on the version, as pending_version.publishing. Returned by GET /datasets
            and GET /datasets/{datasetId} to data-admin, super-admin and internal-request callers only.
          properties:
            id:
              type: string
              format: uuid
            queue:
              type: string
              enum: [bulk-load, raster-load, bulk-delete, version-reset, version-discard]
        active_job:
          type: object
          nullable: true
          readOnly: true
          description: >-
            The bulk-load or raster-load job running on the dataset, or null. A load no longer changes
            the dataset's status, so this is how a load in progress shows. Returned by GET /datasets
            and GET /datasets/{datasetId} to data-admin, super-admin and internal-request callers only.
          properties:
            id:
              type: string
              format: uuid
            queue:
              type: string
              enum: [bulk-load, raster-load]
        version_of:
          type: string
          nullable: true
          readOnly: true
          description: >-
            For a version, the id of the published dataset it is a version of; null otherwise. A version
            is never PUBLISHED, so only data-admin, super-admin and internal-request callers see one.
        version_number:
          type: integer
          readOnly: true
          description: >-
            The dataset's version: 1 until a version of it is first published. A version has the number
            the dataset takes when it is published.
        data_updated_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: >-
            When the dataset's published data last changed: its first publish, a version published into
            it, or a raster load that removed layers from it. Metadata edits move only updated_at. Null
            for a dataset that has never been published.
        pending_version:
          type: object
          nullable: true
          readOnly: true
          description: >-
            The dataset's open version, or null. Versions are left out of GET /datasets and show here
            instead. Returned by GET /datasets and GET /datasets/{datasetId} to data-admin, super-admin
            and internal-request callers only.
          properties:
            slug:
              type: string
              description: The version's id
            name:
              type: string
              description: The version's name, "<dataset name> v<number> increment"
            number:
              type: integer
            status:
              type: string
            updated_at:
              type: string
              format: date-time
              nullable: true
              description: When the version last changed, shown in its row of the admin list
            publishing:
              type: boolean
              description: >-
                Whether a version-publish of the version is queued or running. While it is, the
                version's loads, reset, discard and a second publish are refused with 409, and the
                dataset keeps serving its current data until the publish commits.
            queued_job:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                  format: uuid
                queue:
                  type: string
                  enum: [bulk-load, raster-load, version-reset]
            active_job:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                  format: uuid
                queue:
                  type: string
                  enum: [bulk-load, raster-load, version-reset]

    SoilProperty:
      type: object
      required:
        - id
