  /soil-data:
    get:
      x-eov-operation-handler: controllers/soil-data
      x-eov-operation-id: getSoilData
      x-entitlements-required: true
      summary: Retrieves soil data
      description: >-
        Returns vector rows (one per Observation of a point or polygonal dataset) and raster rows
        (one per pixel of a raster dataset's Raster Layers), told apart by `gis_datatype`. Every
        vector row comes before every raster row, and one cursor pages through both: pass the
        `cursor` of the last row received. Raster rows are returned only with a filter that has
        geometries: one per pixel that touches the filter's area (any overlap counts, so an area
        smaller than a pixel still returns the pixel it lies in), excluding nodata pixels, for each
        Raster Layer whose valid data meets that area and whose soil property, depth range,
        reference period and dataset licences match the filter. Datasets are subject to the same
        rules for both kinds of rows. A dataset that is not `PUBLISHED` is treated as unknown, and
        contributes no rows, unless the caller has the `data-admin`, `super-admin` or
        `internal-request` scope. Raster rows are ordered by Raster Layer, then pixel row, then
        pixel column, whatever `sort` is: `sort` orders the vector rows only.
      tags:
        - soil-data
      security:
        - bearerAuth: []
        - {}
      parameters:
        - in: query
          name: datasets
          required: true
          description: IDs of datasets to retrieve data from (comma-separated)
          schema:
            type: array
            items:
              type: string
          explode: false
        - in: query
          name: filterId
          required: false
          description: ID of a stored data filter to apply
          schema:
            type: string
            format: uuid
          explode: false
        - in: query
          name: limit
          required: true
          description: Number of items in the response
          schema:
            type: number
            default: 100
            minimum: 1
            maximum: 200
        - in: query
          name: cursor
          required: false
          description: Pagination cursor, the `cursor` of the last row of the previous page.
          schema:
            type: string
        - in: query
          name: sort
          required: false
          description: Sort column. Prepend with '-' for descending order
          schema:
            type: string
            enum:
              - dataset_id
              - dataset_name
              - extractant_concentration
              - laboratory_method
              - extraction_base
              - extraction_ratio
              - geometry
              - measurement_procedure
              - license_name
              - limit_of_detection
              - max_depth
              - min_depth
              - property_acronym
              - sample_pretreatment
              - sampling_date
              - soil_property
              - standard_unit
              - technique
              - value
              - -dataset_id
              - -dataset_name
              - -extractant_concentration
              - -laboratory_method
              - -extraction_base
              - -extraction_ratio
              - -geometry
              - -measurement_procedure
              - -license_name
              - -limit_of_detection
              - -max_depth
              - -min_depth
              - -property_acronym
              - -sample_pretreatment
              - -sampling_date
              - -soil_property
              - -standard_unit
              - -technique
              - -value
      responses:
        '200':
          description: Soil data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SoilDataSample'
        '400':
