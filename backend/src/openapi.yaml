openapi: 3.0.3
info:
  title: SoilHive core API
  version: 1.0.0
servers:
  - url: /api/v1
  - url: /

paths:
  /entitlements:
    get:
      x-eov-operation-handler: controllers/entitlements
      x-eov-operation-id: getUserEntitlements
      summary: Get user entitlements
      security:
        - bearerAuth: []
      tags:
        - auth
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum: [datasets, configs, dashboards]
          description: >
            Which namespace to return entitlements for. `datasets` and `configs` are real storage
            namespaces, returned unfiltered. `dashboards` is a Config Kind, not a storage
            namespace: a filtered view over `configs`, returning only the entries whose id, after
            any `plugin:{pluginId}:` prefix, is `dashboards:` followed by a non-empty id. There is
            no "all scopes" response.

            For a normal user the response lists the grants the user holds. A Privileged caller
            (internal-request, data-admin or super-admin) bypasses config Entitlements, so for
            `configs` and `dashboards` the response also gives it `read` and `write` on every config
            that is not deleted, on top of its grants. For `datasets` a Privileged caller gets only the
            grants it holds.
      responses:
        '200':
          description: List of user entitlements for the requested scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlements'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/config:
    get:
      x-eov-operation-handler: controllers/auth
      x-eov-operation-id: getConfig
      summary: Retrieve authentication configuration
      tags:
        - auth
      responses:
        '200':
          description: Authentication configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /oauth/token:
    post:
      x-eov-operation-handler: controllers/auth
      x-eov-operation-id: getToken
      summary: Obtain JWT token using password grant
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum:
                    - password
                  description: The OAuth2 grant type (only password is supported)
                username:
                  type: string
                  description: Username (required for password grant, value is ignored)
                password:
                  type: string
                  format: password
                  description: Password (required for password grant)
              required:
                - grant_type
                - password
      responses:
        '200':
          description: JWT token response
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer

  /.well-known/jwks.json:
    get:
      x-eov-operation-handler: controllers/auth
      x-eov-operation-id: getJwks
      summary: Public key that verifies Password-grant tokens
      description: Only available in password authentication mode.
      tags:
        - auth
      responses:
        '200':
          description: JSON Web Key Set with the ES256 key that signs Password-grant tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
        '404':
          $ref: '#/components/responses/NotFound'

  /.well-known/plugin-jwks.json:
    get:
      x-eov-operation-handler: controllers/auth
      x-eov-operation-id: getPluginJwks
      summary: Public key that verifies Plugin tokens
      description: >-
        Plugin Backends verify the Plugin tokens they receive against this key set
        (docs/adr/0065). Available in every auth mode once PLUGIN_TOKEN_SECRET and CORE_PUBLIC_URL
        are set, and never lists a key that verifies user tokens.
      tags:
        - auth
      responses:
        '200':
          description: JSON Web Key Set with the ES256 key that signs Plugin tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
        '404':
          $ref: '#/components/responses/NotFound'

  /plugins/{pluginId}/token:
    parameters:
      - name: pluginId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
        description: The id the plugin exports as `pluginId`
    post:
      x-eov-operation-handler: controllers/plugins
      x-eov-operation-id: postPluginToken
      summary: Get a Plugin token for one plugin
      description: >-
        Exchanges the caller's token for a short-lived Plugin token that the plugin's own Plugin
        Backend accepts (docs/adr/0065). The host frontend calls this on the plugin's behalf.
        `aud` is `plugin:{pluginId}`, `sub` is the caller's Subject, and the token expires within 5
        minutes and never after the caller's token. On the core API it only reads, as its user,
        without admin rights unless the deployment lists the plugin in PLUGIN_TOKEN_ADMIN_PLUGINS.
        Limited per Subject and plugin, and per Subject overall.
      security:
        - bearerAuth: []
      tags:
        - auth
      responses:
        '200':
          description: The Plugin token
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - access_token
                  - token_type
                  - expires_in
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    enum:
                      - Bearer
                  expires_in:
                    type: integer
                    description: Seconds until the token expires
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: Plugin tokens are not configured on this deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /configs/{configId}:
    parameters:
      - name: configId
        in: path
        required: true
        schema:
          type: string
        description: Unique identifier for the configuration
    put:
      x-eov-operation-handler: controllers/configs
      x-eov-operation-id: putConfig
      x-entitlements-required: true
      summary: Create or update configuration item
      description: >-
        Requires an existing WRITE grant on the config (EVERYONE's grants count), or a privileged
        caller. A non-admin caller with no WRITE grant may still claim the config on first access
        when configId follows the plugin:{pluginId}:{id} convention (matching the id
        usePluginConfig builds on the frontend) and the id has never been created before
        (including soft-deleted): the row is claimed via a conflict-detecting insert, and the
        caller who wins it is self-granted WRITE in the same request. A caller already allowed to
        write, a privileged one included, is self-granted WRITE too when its save creates a
        plugin:{pluginId}:{id} config, or brings back a deleted one (ADR-0083). Any other configId (a
        system config not matching that convention) is first-access only for a privileged caller.
        For a stored `dashboards` Config Kind id, a non-privileged caller with WRITE also needs
        `preview` on each private Dataset in the stored value's top-level `datasets` array, and
        each of those Datasets must exist; otherwise nothing is written (ADR-0079). A first-access
        insert has no stored value and is not checked.
      tags:
        - configs
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigItem'
      responses:
        '200':
          description: Configuration updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/DashboardDatasetsForbidden'
    get:
      x-eov-operation-handler: controllers/configs
      x-eov-operation-id: getConfig
      x-entitlements-required: true
      summary: Retrieve configuration item
      description: >-
        No security scheme: stays anonymous-friendly, since the frontend fetches theme/logo before
        login. Requires READ or WRITE on the config (EVERYONE's grants count), or a privileged
        caller; an anonymous caller relies solely on an EVERYONE grant. For a `dashboards` Config
        Kind id, a non-privileged caller also needs `preview` on each private Dataset in the
        top-level `datasets` array, and each of those Datasets must exist (ADR-0079).
      tags:
        - configs
      responses:
        '200':
          description: Configuration object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigItem'
        '403':
          $ref: '#/components/responses/DashboardDatasetsForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      x-eov-operation-handler: controllers/configs
      x-eov-operation-id: deleteConfig
      x-entitlements-required: true
      summary: Delete or leave configuration item
      description: >-
        For a plugin:{pluginId}:{id} config and a caller who is not privileged, a Leave: removes
        every grant the caller's own Subject holds on it (READ is enough) and drops it from the
        caller's own pending Invites. Once no Subject but EVERYONE holds a grant, the config is
        deleted as below. While EVERYONE holds a grant, the caller gets 409 with
        `shared_with_everyone: true` and nothing changes, unless it is the last Subject holding a
        grant of its own, whose Leave deletes the config. A caller holding no grant gets 403
        (ADR-0083).

        Otherwise a delete, which requires an existing WRITE grant on the config (EVERYONE's grants
        count) or a privileged caller. No first-access bypass — deleting is not a way to
        first-access an id. Also destroys every data request and soil index run attached to the
        config and, for a plugin:{pluginId}:{id} config, every subject's entitlements on it, so only
        a privileged caller can write that id again.
      tags:
        - configs
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Configuration left or deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /configs:
    get:
      x-eov-operation-handler: controllers/configs
      x-eov-operation-id: getConfigs
      x-entitlements-required: true
      summary: Retrieve multiple configuration items by id
      description: >-
        No security scheme: stays anonymous-friendly, same as GET /configs/{configId}. Ids the
        caller lacks READ/WRITE on (EVERYONE's grants count) are silently omitted from the
        response, the same precedent already used for ids that don't exist. A `dashboards` Config
        Kind id returns only the summary keys of its value (name, type, visibility, status,
        soilIndexRunId, framework, updated_by). For a caller who lacks `preview` on a private
        Dataset of the dashboard, or when one of its Datasets is unpublished or deleted, the summary
        leaves out soilIndexRunId and adds `datasets_blocked: true`; the id is still listed. A
        dashboard EVERYONE holds a grant on adds `shared_with_everyone: true` (ADR-0083). GET
        /configs/{configId} and POST /configs-export return the full value (ADR-0079).
      tags:
        - configs
      parameters:
        - in: query
          name: ids
          required: true
          description: IDs of configuration items to retrieve (comma-separated)
          schema:
            type: array
            items:
              type: string
            minItems: 1
            maxItems: 100
          explode: false
      responses:
        '200':
          description: Object mapping requested ids to their configuration data and the time of their last save
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  required:
                    - data
                    - updated_at
                  properties:
                    data: {}
                    updated_at:
                      type: string
                      format: date-time

  /configs-export:
    post:
      x-eov-operation-handler: controllers/configs
      x-eov-operation-id: exportConfigs
      summary: Exports all configuration items
      tags:
        - configs
      security:
        - bearerAuth: [super-admin]
      responses:
        '200':
          description: Object containing all the stored configurations

  /storage/config:
    get:
      x-eov-operation-handler: controllers/storage
      x-eov-operation-id: getConfig
      summary: Retrieve public storage configuration
      tags:
        - storage
      responses:
        '200':
          description: Public storage configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicStorageConfig'

  /frontend/logo:
    post:
      x-eov-operation-handler: controllers/files
      x-eov-operation-id: logoUpload
      summary: Upload platform logo
      tags:
        - frontend
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
            encoding:
              file:
                contentType: image/svg+xml
      responses:
        '201':
          description: Logo uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDescriptor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: The logo is larger than 5 MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: [super-admin]
    get:
      x-eov-operation-handler: controllers/files
      x-eov-operation-id: logoDownload
      summary: Download platform logo
      tags:
        - frontend
      responses:
        '200':
          description: Logo downloaded successfully
        '404':
          $ref: '#/components/responses/NotFound'
          description: Custom logo not found
    delete:
      x-eov-operation-handler: controllers/files
      x-eov-operation-id: logoDelete
      summary: Remove custom logo
      tags:
        - frontend
      security:
        - bearerAuth: [super-admin]
      responses:
        '204':
          description: Logo deleted successfully

  /epsg:
    get:
      x-eov-operation-handler: controllers/datasets
      x-eov-operation-id: getEpsgCodes
      summary: Get supported EPSG codes
      tags:
        - datasets
      responses:
        '200':
          description: EPSG code array
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - code
                    - name
                  properties:
                    code:
                      type: number
                    name:
                      type: string
  /datasets:
    get:
      x-eov-operation-handler: controllers/datasets
      x-eov-operation-id: getDatasets
      x-entitlements-required: true
      summary: Get metadata for datasets
      description: >-
        Returns PUBLISHED datasets only unless caller has data-admin, super-admin or internal-request scopes.
        Versions are left out: each shows on its dataset as pending_version.
      tags:
        - datasets
      responses:
        '200':
          description: Dataset array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dataset'
    post:
      x-eov-operation-handler: controllers/datasets
      x-eov-operation-id: createDataset
      summary: Create a new dataset
      tags:
        - datasets
      security:
        - bearerAuth: [super-admin, data-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDatasetInput'
      responses:
        '201':
          description: Dataset created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /datasets/{datasetId}:
    parameters:
      - name: datasetId
        in: path
        required: true
        schema:
          type: string
        description: Dataset ID
    get:
      x-eov-operation-handler: controllers/datasets
      x-eov-operation-id: getDataset
      x-entitlements-required: true
      summary: Get metadata for a specific dataset
      description: Returns PUBLISHED datasets only unless caller has data-admin, super-admin or internal-request scopes.
      tags:
        - datasets
      responses:
        '200':
          description: Dataset information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      x-eov-operation-handler: controllers/datasets
      x-eov-operation-id: updateDataset
      summary: Update an existing dataset
      tags:
        - datasets
      security:
        - bearerAuth: [super-admin, data-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dataset'
      responses:
        '200':
          description: Dataset updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The dataset has a bulk-load, raster-load or bulk-delete job queued or running, or the dataset
            is a version and the update sets its status to PUBLISHED (a version goes live by being published
            into the dataset it is a version of), or changes its general information: its name, descriptive
            metadata or preprocessing steps, which are edited on the dataset it is a version of. Sending
            a field unchanged is accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      x-eov-operation-handler: controllers/datasets
      x-eov-operation-id: deleteDataset
      summary: Delete a specific dataset
      tags:
        - datasets
      security:
        - bearerAuth: [super-admin, data-admin]
      parameters:
        - name: datasetId
          in: path
          required: true
          description: The ID of the dataset to delete
          schema:
            type: string
      responses:
        '204':
          description: Dataset successfully deleted (no content returned)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: >-
            The dataset has a bulk-load, raster-load or bulk-delete job queued or running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /datasets/{datasetId}/versions:
    parameters:
      - name: datasetId
        in: path
        required: true
        schema:
          type: string
        description: The id of the published dataset
    post:
      x-eov-operation-handler: controllers/datasets
      x-eov-operation-id: createDatasetVersion
      summary: Open a version of a published dataset, to add data to it
      description: >-
        Creates the version: a dataset of its own, named "<dataset name> v<number> increment", PENDING and private,
        with the dataset's descriptive metadata. Data is added to it through the usual ingestion steps,
        by its id, and goes live only when the version is published. Refused with 409 unless the dataset
        is PUBLISHED, isn't a version itself, has no open version and no job queued or running.
      tags:
        - datasets
      security:
        - bearerAuth: [super-admin, data-admin]
      responses:
        '201':
          description: The version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The dataset isn't PUBLISHED, is a version, already has an open version, has a job queued or
            running, or another dataset already has the version's name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /datasets/{datasetId}/versions/{versionId}:
    parameters:
      - name: datasetId
        in: path
        required: true
        schema:
          type: string
        description: The id of the published dataset
      - name: versionId
        in: path
        required: true
        schema:
          type: string
        description: The id of its open version
    delete:
      x-eov-operation-handler: controllers/datasets
      x-eov-operation-id: discardDatasetVersion
      summary: Discard a dataset's open version
      description: >-
        Discards the version the way a bulk delete removes a dataset. The version is marked deleted at
        once: it leaves GET /datasets (pending_version is null), its id returns 404, and a new version
        can be opened straight away, under the same name and a new id. A version-discard job then
        removes its files and data in the background. The published dataset is left as it is. Refused
        with 409 while the version has a load or reset queued or running.
      tags:
        - datasets
      security:
        - bearerAuth: [super-admin, data-admin]
      responses:
        '202':
          description: The version-discard job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The version has a bulk-load, raster-load or version-reset job queued or running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /datasets/{datasetId}/versions/{versionId}/reset:
    parameters:
      - name: datasetId
        in: path
        required: true
        schema:
          type: string
        description: The id of the published dataset
      - name: versionId
        in: path
        required: true
        schema:
          type: string
        description: The id of its open version
    post:
      x-eov-operation-handler: controllers/datasets
      x-eov-operation-id: resetDatasetVersion
      summary: Remove the data loaded into a version
      description: >-
        Queues a version-reset job, which removes everything loaded into the version and returns it and
        its files to PENDING, so they can be mapped and loaded again. This is how a loaded vector file of
        a version is corrected or removed. Refused with 409 while the version has a job queued or running.
      tags:
        - datasets
      security:
        - bearerAuth: [super-admin, data-admin]
      responses:
        '202':
          description: The version-reset job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The version has a bulk-load, raster-load or version-reset job queued or running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /datasets/{datasetId}/versions/{versionId}/publish:
    parameters:
      - name: datasetId
        in: path
        required: true
        schema:
          type: string
        description: The id of the published dataset
      - name: versionId
        in: path
        required: true
        schema:
          type: string
        description: The id of its open version
    post:
      x-eov-operation-handler: controllers/datasets
      x-eov-operation-id: publishDatasetVersion
      summary: Publish a version into its dataset
      description: >-
        Queues a version-publish job, which in one transaction adds the version's data to the dataset,
        applies the publication settings to it, increments its version_number, sets its data_updated_at,
        rolls its metadata up again and deletes the version. The dataset keeps its id. Its readers see
        its current data until the job commits, and a failed job publishes nothing: the version stays
        LOADED with the job's error, and can be published again. While the job is queued or running,
        pending_version.publishing is true, and the dataset and the version are locked.
      tags:
        - datasets
      security:
        - bearerAuth: [super-admin, data-admin]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                visibility:
                  type: string
                  enum: [public, private]
                  description: The dataset's visibility once published; kept as it is when absent
                entitlements:
                  allOf:
                    - $ref: '#/components/schemas/Entitlements'
                  description: >-
                    The grants to the dataset once published, replacing its current ones as PUT
                    /datasets/{datasetId}/entitlements does; kept as they are when absent
                delete_source_files:
                  type: boolean
                  description: >-
                    Deletes the uploads of the version's files once published, as a load does when it
                    is set. A version's loads keep them, since a reset loads its files again.
      responses:
        '202':
          description: The version-publish job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The dataset isn't PUBLISHED, the version isn't LOADED or has files not loaded yet, the
            version holds another data type than the dataset (point, polygonal or raster), or either
            has a job queued or running, a version-publish included
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs:
    post:
      x-eov-operation-handler: controllers/jobs
      x-eov-operation-id: postJob
      x-entitlements-required: true
      summary: Starts async job
      description: >-
        bulk-load, raster-load, file-to-db, long-stage and bulk-delete jobs require data-admin or super-admin scope.
        Their processors operate on a dataset that is not yet PUBLISHED, which only a privileged caller can resolve.
        A bulk-load, raster-load or bulk-delete job is refused with 409 while its dataset already has one of
        those, or a version-reset or version-discard, queued or running, and its dataset_id is stored as the
        dataset's current id. A bulk-load or raster-load into a version is refused with 400 when it sets
        delete_source_files: resetting the version loads its files again from their uploads.
        A long-stage job copies a long file into a staging table of its own, which the file-to-db job of
        a mapping with long_format then pivots. The upload does not start it: start it once the file is
        long and its geometry and CRS are known, and again after any of them changes. It fails for a loaded file, and while the file is staged or its dataset loads.
        An export over its Export Limits or the XLSX record cap is refused with 400 when its counts finish
        within EXPORT_LIMITS_CHECK_TIMEOUT_MS (default 5 seconds); otherwise it is started and its job fails instead.
        While administrators require a signed-in user to export (exportRequiresSignIn in the theme config's exportLimits),
        an export without a token is refused with 401, before its datasets are checked.
        An export identical to an unfinished one from the same signed-in caller returns that job with 200
        instead of starting another. Anonymous exports always start a new job.
      tags:
        - jobs
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/BulkLoadJob'
                - $ref: '#/components/schemas/RasterLoadJob'
                - $ref: '#/components/schemas/ExportJob'
                - $ref: '#/components/schemas/FileToDbJob'
                - $ref: '#/components/schemas/LongStageJob'
                - $ref: '#/components/schemas/BulkDeleteJob'
              discriminator:
                propertyName: type
                mapping:
                  bulk-load: '#/components/schemas/BulkLoadJob'
                  raster-load: '#/components/schemas/RasterLoadJob'
                  export: '#/components/schemas/ExportJob'
                  file-to-db: '#/components/schemas/FileToDbJob'
                  long-stage: '#/components/schemas/LongStageJob'
                  bulk-delete: '#/components/schemas/BulkDeleteJob'
      responses:
        '200':
          description: An identical export from the same caller is still unfinished; that job is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '201':
          description: Async job started successfull
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Invalid request, or an export over its limits; `detail` names the limit and what to change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The dataset has a bulk-load, raster-load, bulk-delete, version-reset or version-discard job
            queued or running, or a bulk-load or raster-load targets a published dataset (data is added
            to it through a version: POST /datasets/{datasetId}/versions), or a bulk-delete targets a
            version or a dataset with an open version.
            A raster-load of a published dataset with no file waiting for a load is accepted: it only
            removes the layers of removed files.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      x-eov-operation-handler: controllers/jobs
      x-eov-operation-id: getJobs
      summary: Get all async jobs for the user
      tags:
        - jobs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Job array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'

