      responses:
        '200':
          description: List of dataset entitlements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlements'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      x-eov-operation-handler: controllers/entitlements
      x-eov-operation-id: setDatasetEntitlement
      summary: Edits a dataset entitlement
      tags:
        - datasets
      security:
        - bearerAuth: [super-admin, data-admin]
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
