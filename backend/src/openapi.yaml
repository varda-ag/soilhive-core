      x-eov-operation-id: getInvites
      x-plugin-token-denied: true
      x-entitlements-required: true
      summary: List Invites
      description: >-
        Invites naming a config item or a Dataset, newest first, withdrawn ones left out. A caller
        sees an Invite they created, or one they could have created: `write` on every config item
        in it, and admin rights if it holds a Dataset. Only an admin may list without `config_id`;
        anyone else must hold `write` on that config item (docs/adr/0082).
      tags:
        - invites
      security:
        - bearerAuth: []
      parameters:
        - name: config_id
          in: query
          required: false
          schema:
            type: string
        - name: dataset_id
          in: query
          required: false
          description: A Dataset slug; any slug it has held matches.
          schema:
            type: string
      responses:
        '200':
          description: Invites the caller can see
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      x-eov-operation-handler: controllers/invites
      x-eov-operation-id: createInvite
      x-entitlements-required: true
      summary: Create an Invite
      description: >-
        Holds back grants until someone redeems the returned token. The creator may include only
        what they could grant directly: `write` on each config item, and admin rights for any
        Dataset. The token is returned once and never stored (docs/adr/0082). With a `recipient`,
        only the person with that email can redeem it (docs/adr/0081).
      tags:
        - invites
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteCreate'
      responses:
        '201':
          description: The Invite, with its token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /invites/redeem:
    post:
      x-eov-operation-handler: controllers/invites
      x-eov-operation-id: redeemInvite
      summary: Redeem an Invite
      description: >-
        Grants what the Invite holds to the caller's own Subject, whole or not at all. Only a
        person whose access token carries `email` may redeem, so that the grant is keyed by their
        email (docs/adr/0081). Redeeming again what the caller already redeemed succeeds and
        changes nothing. A 403 with `email_required` means the caller's token has no `email` or is
        a Machine caller's; with `recipient_hint`, the Invite is for another person; with
        neither, its creator can no longer share what it grants. Either way the Invite stays
        pending.
      tags:
        - invites
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - token
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        '200':
          description: What was granted
          content:
            application/json:
              schema:
                type: object
                required:
                  - grants
                properties:
                  grants:
                    $ref: '#/components/schemas/InviteGrants'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            The caller's token has no `email` or is a Machine caller's, the Invite is for another
            person, or its creator can no longer share what it grants
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      email_required:
                        type: boolean
                        description: Set when the caller's token has no `email` or is a Machine caller's
                      recipient_hint:
                        type: string
                        description: The recipient's email with most of it hidden, e.g. `j•••@example.com`
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'

