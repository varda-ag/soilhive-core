        name:
          type: string
          description: Vocabulary item name

    Procedure:
      type: object
      properties:
        id:
          type: string
          description: Identifier for the procedure
          readOnly: true
        sample_pretreatment:
          type: string
          nullable: true
          description: Pretreatment applied before analysis
        technique:
          type: string
          nullable: true
          description: Analytical or experimental technique used
          enum:
            - calculated
            - lab procedure
            - spectral
        laboratory_method:
          type: string
          nullable: true
          description: The named laboratory method or protocol used to generate the result, including standard protocols or digestion/combustion approaches where applicable
        extractant_concentration:
          type: string
          nullable: true
          description: Extractant concentration details
        extraction_ratio:
          type: string
          nullable: true
          description: Ratio of sample to extractant used
        extraction_base:
          type: string
          nullable: true
          description: Base or solvent used in extraction
        measurement_procedure:
          type: string
          nullable: true
          description: Measurement procedure or instrument used for analysis
        limit_of_detection:
          type: string
          nullable: true
          description: Limit of detection for the measurement

    SoilRecord:
      type: object
      required:
        - geometry
      properties:
        sampling_date:
          type: string
          pattern: '^\d{4}(-\d{2}){0,2}$'
          nullable: true
        license:
          type: string
          nullable: true
        max_depth:
          type: number
          nullable: true
        min_depth:
          type: number
          nullable: true
        geometry:
          $ref: '#/components/schemas/Geometry'
        user_dropped:
          type: boolean
      additionalProperties:
        anyOf:
          - type: string
            nullable: true
          - type: number
            nullable: true

    DataMapping:
      type: object
      required:
        - id
        - data_mapping
      properties:
        id:
          type: string
          description: Unique identifier for the data mapping
        data_mapping:
          $ref: '#/components/schemas/DataMappingObject'

    DataMappingObject:
      type: object
      properties:
        drop_records:
          type: array
          items:
            type: integer
          description: Row indices to exclude from the import
        long_format:
          $ref: '#/components/schemas/LongFormatMapping'
      additionalProperties:
        # anyOf, not oneOf: a band entry also matches PropertyMapping, which leaves its other keys open
        anyOf:
          - type: string
          - $ref: '#/components/schemas/PropertyMapping'
          - $ref: '#/components/schemas/RasterBandMapping'
      description: >
        Dynamic object where keys are column names from the source data, or band numbers for a
        raster file's band mapping.
        Values can be either:
        - A string (for metadata columns like 'min_depth', 'max_depth', 'sampling_date', etc.)
        - A PropertyMapping object (for property columns with conversion/procedure info)
        - A RasterBandMapping object (for a band of a raster file)

        Two property columns mapped to the same soil property, procedure and unit conversion are
        refused with 400. Bands are exempt, and are told apart by their min_depth and max_depth keys,
        so a band entry must always send both, null when unknown.

        A mapping with long_format is of a long file, with one row per measured value: it maps
        measurement types in place of property columns, so it holds no PropertyMapping value.
      example:
        magnesium:
          property_id: 'magnesium'
          procedure_id: 'sieved-over-2-mm-sieve-lab-procedure-water-h2o--01-05-weight-volume-electrode'
          conversion_id: 'cm'
        total_nitrogen:
          property_id: 'nitrogen-total'
        upper_depth: 'min_depth'
        lower_depth: 'max_depth'
        date: 'sampling_date'

    PropertyMapping:
      type: object
      required:
        - property_id
      properties:
        property_id:
          type: string
          description: ID of the soil property
        conversion_id:
          type: string
          description: Optional ID for unit conversion
        min_val:
          type: number
          description: Optional minimum value constraint
        max_val:
          type: number
          description: Optional maximum value constraint
        procedure_id:
          type: string
          description: Optional slug for the procedure

    RasterBandMapping:
      type: object
      description: >
        What one band of a raster file measures. Both depth keys are required, null when unknown:
        they are what tells a band from a property column.
      required:
        - property_id
        - min_depth
        - max_depth
      properties:
        property_id:
          type: string
          description: Slug of the soil property
        conversion_id:
          type: string
          nullable: true
          description: Slug of the unit conversion, or null when the property declares none
        procedure_id:
          type: string
          nullable: true
          description: Slug of the procedure
        min_depth:
          type: number
          nullable: true
          description: Upper depth of the band in cm, or null when unknown
        max_depth:
          type: number
          nullable: true
          description: Lower depth of the band in cm, or null when unknown
        reference_period_start:
          type: string
          nullable: true
        reference_period_stop:
          type: string
          nullable: true
        layer_description:
          type: string
          description: Free text about the band's raster layer
        additional_resources:
          type: array
          description: Files to attach to the band's raster layer
          items:
            type: object
            properties:
              url:
                type: string
              file_id:
                type: string
                description: Slug of the file

    LongFormatMapping:
      type: object
      description: >
        The role columns of a long file and its mapped measurement types. A measurement type is one
        combination of property code, unit and procedure values found in the file. One that is not
        listed is not loaded. Either property_col or fixed_property_id is set, not both.
      required:
        - value_col
        - measurement_types
      properties:
        property_col:
          type: string
          description: Column holding the property code of each row
        fixed_property_id:
          type: string
          description: The soil property of the whole file, for a file with no property column
        value_col:
          type: string
          description: Column holding the measured value
        unit_col:
          type: string
          description: Optional column holding the unit of each row
        method_code_col:
          type: string
          description: Optional column holding a method code of each row
        procedure_cols:
          type: object
          description: Optional. Procedure field to the column holding it
          properties:
            technique:
              type: string
            sample_pretreatment:
              type: string
            laboratory_method:
              type: string
            extractant_concentration:
              type: string
            extraction_ratio:
              type: string
            extraction_base:
              type: string
            measurement_procedure:
              type: string
            limit_of_detection:
              type: string
          additionalProperties: false
        measurement_types:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/MeasurementTypeMapping'
      example:
        property_col: det
        value_col: conc
        unit_col: um
        measurement_types:
          - col: s1
            match:
              property: P_OLSEN_2
              unit: mg kg-1
            property_id: 'phosphorus-extractable'
            conversion_id: 'mg-kg'

    MeasurementTypeMapping:
      type: object
      required:
        - col
        - match
      properties:
        col:
          type: string
          pattern: '^s[1-9][0-9]*$'
          description: Name of its column in the staged table, such as s1. Unique in the mapping, and kept once given.
        match:
          type: object
          description: >
            The values of the file that define the measurement type, one per role column of the mapping:
            property, unit, method_code and the procedure fields. Compared trimmed; null or absent matches an empty cell.
          additionalProperties:
            type: string
            nullable: true
        property_id:
          type: string
          description: ID of the soil property. May be left out when the mapping sets fixed_property_id.
        conversion_id:
          type: string
          description: Optional ID for unit conversion
        min_val:
          type: number
          description: Optional minimum value constraint
        max_val:
          type: number
          description: Optional maximum value constraint
        procedure_id:
          type: string
          description: Optional slug for the procedure

    FoundMeasurementType:
      type: object
      required:
        - match
        - row_count
        - min_value
        - max_value
        - non_numeric_count
      properties:
        match:
          type: object
          description: >
            The values of the file that define the measurement type, one per role column asked for:
            property, unit, method_code and the procedure fields. Trimmed; null for an empty cell.
            Goes as it is into the match of a MeasurementTypeMapping.
          additionalProperties:
            type: string
            nullable: true
        row_count:
          type: integer
          description: Number of rows with a value
        min_value:
          type: number
          nullable: true
          description: Lowest numeric value; null when no value is a number
        max_value:
          type: number
          nullable: true
          description: Highest numeric value; null when no value is a number
        non_numeric_count:
          type: integer
          description: Number of values that are not a number
        suggestion:
          type: object
          description: >
            Suggested answers, left out when there are none. Taken from an earlier long mapping with
            the same property code (and unit), else from a property code equal to a soil property's
            slug, name or acronym, a unit equal to the original unit of one of its conversions, and
            procedure values equal to entries of their lists. Case and spaces are ignored.
          properties:
            property_id:
              type: string
              description: Slug of the soil property
            conversion_id:
              type: string
              description: Slug of the unit conversion
            procedure_id:
              type: string
              description: Slug of the procedure an earlier mapping used
            min_val:
              type: number
            max_val:
              type: number
            procedure:
              type: object
              description: >
                List entries equal to the file's own procedure values, by procedure field, in the
                shape POST /procedures takes. Left out when procedure_id is given.
              additionalProperties:
                type: string

    DatasetFileMappingRequest:
      type: object
      properties:
        fileID:
          type: string
          description: The file's slug.
        mappingId:
          type: string
          format: uuid
          description: A data mapping's id. Data mappings have no slug, so this is the primary key.

    DatasetFileMappingResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The mapping's own id. Dataset-file mappings have no slug, so this is the primary key.
        fileID:
          type: string
          description: The file's slug — never its primary key.
        mappingId:
          type: string
          format: uuid
          description: A data mapping's id. Data mappings have no slug, so this is the primary key.

    BulkLoadJob:
      type: object
      properties:
        type:
          type: string
          enum: [bulk-load]
          description: Job type
        dataset_id:
          type: string
        delete_source_files:
          type: boolean
          description: When true, deletes source files from storage after loading

    RasterLoadJob:
      type: object
      additionalProperties: false
      required:
        - type
        - dataset_id
      properties:
        type:
          type: string
          enum: [raster-load]
          description: Job type
        dataset_id:
          type: string
          description: Dataset whose raster files are to be loaded
        delete_source_files:
          type: boolean
          description: >
            When true, deletes the original upload of every loaded file that was converted (to a COG
            or to the standard unit) once the load succeeds. Files used as uploaded are kept. A loaded
            file's mapping can't be changed afterwards, so nothing needs the original again.
      description: >
        Loads a raster dataset's files that are waiting for a load, and deletes the raster layers of files
        removed from the dataset since. The ingested files remain the raster layers' data and are never removed.

    ExportJob:
      type: object
      required:
        - type
        - filter_id
        - dataset_ids
        - formats
      properties:
        type:
          type: string
          enum: [export]
          description: Job type
        anonymous:
          type: boolean
          description: Set to true to allow access without authentication
        filter_id:
          type: string
          format: uuid
          description: Filter ID to specify which data to export
        dataset_ids:
          type: array
          items:
            type: string
          description: list of dataset IDs to include in the export
        formats:
          type: array
          items:
            type: string
            enum: [csv, xlsx, gpkg, shp, geojson, tiff]
          description: List of export file formats
        public_homepage_url:
          type: string
          format: uri
          description: Optional URL pointing to platform homepage that will appear in Readme.PDF
        public_metadata_urls:
          type: object
          additionalProperties:
            type: string
            format: uri
          description: Optional mapping of dataset_id to metadata URL for Readme.PDF

    FileToDbJob:
      type: object
      properties:
        type:
          type: string
          enum: [file-to-db]
          description: Job type
        file_id:
          type: string
          description: File ID to be processed and inserted into the database
        dataset_id:
          type: string
          nullable: true
          description: Optional. Dataset the file belongs to — used to surface staging errors per dataset. If omitted, errors for this job will not appear in GET /errors/datasets.

    LongStageJob:
      type: object
      properties:
        type:
          type: string
          enum: [long-stage]
          description: Job type
        file_id:
          type: string
          description: Long file to copy into its staging table, as it is
        geom_col:
          type: string
          description: >
            Optional. Column holding the geometry, as the user set it on a mapping not saved yet. Read
            ahead of the saved mapping and of the detected columns. Not with lat_col and lon_col.
        lat_col:
          type: string
          description: Optional. Latitude column, as for geom_col. Given together with lon_col.
        lon_col:
          type: string
          description: Optional. Longitude column, as for geom_col. Given together with lat_col.
        dataset_id:
          type: string
          nullable: true
          description: Optional. Dataset the file belongs to — used to surface staging errors per dataset. If omitted, errors for this job will not appear in GET /errors/datasets.

    BulkDeleteJob:
      type: object
      properties:
        type:
          type: string
          enum: [bulk-delete]
          description: Job type
        dataset_id:
          type: string

    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the job
        queue:
          type: string
          description: Queue containing the job
        status:
          type: string
          enum: [created, retry, active, completed, cancelled, failed]
          description: Current status of the job
        created_by:
          type: string
          description: ID of the user who initiated the job
        created_at:
          type: string
          format: date-time
          description: Timestamp when the job was created
        completed_at:
          type: string
          format: date-time
          description: Timestamp when the job was completed
        data:
          oneOf:
            - $ref: '#/components/schemas/BulkLoadJob'
            - $ref: '#/components/schemas/ExportJob'
            - $ref: '#/components/schemas/FileToDbJob'
            - $ref: '#/components/schemas/LongStageJob'
            - $ref: '#/components/schemas/BulkDeleteJob'

    License:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        full_name:
          type: string
          nullable: true
        url:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true

    RasterFilter:
      type: object
      properties:
        id:
          type: string
          description: The name of the raster filter's table, derived from its name when it was created
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
          description: Whether the raster filter is installed and labelled. Independent of `active`.
        active:
          type: boolean
          description: Whether a data-admin has made this raster filter available for use. Independent of `enabled`.
        mappings:
          type: object
          nullable: true
          description: Pixel value → label. Several pixel values may share a label.
          additionalProperties:
            type: string
        kind:
          type: string
          enum: [categorical, continuous]
          description: What the source raster holds. Only categorical raster filters can be installed for now.
        resolution_m:
          type: integer
          nullable: true
          description: The installed raster's pixel size in metres, at the equator
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
        file_id:
          type: string
          nullable: true
          description: >-
            Privileged callers only. The file awaiting installation. Null once installed, as the
            installation deletes it.
        created_by:
          type: string
          nullable: true
          description: Privileged callers only
        pixel_values:
          type: object
          nullable: true
          additionalProperties:
            type: integer
          description: >-
            Privileged callers only. Each pixel value of the installed raster, nodata excluded, with its pixel
            count. Null until installed, and for raster filters installed from the command line.
        suggested_mappings:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: >-
            Privileged callers only. The labels the uploaded raster carried (its attribute table, category
            names or CLASSES metadata) for values it holds, as a starting point for PUT mappings. Never applied
            by themselves.
        install:
          $ref: '#/components/schemas/RasterFilterInstall'

    RasterFilterInstall:
      type: object
      description: Privileged callers only. Derived from the latest installation job and whether the raster filter's table exists.
      properties:
        status:
          type: string
          enum: [not_installed, queued, installing, installed, failed]
        job_id:
          type: string
          nullable: true
        progress_percentage:
          type: number
        progress_description:
          type: string
        errors:
          type: array
          description: Why the installation failed, as the dataset errors explain a failed load
          items:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
              actions:
                type: array
                items:
                  type: string
              params:
                type: object
                additionalProperties: true
              detail:
                type: string

    RasterFilterMappings:
      type: object
      description: Pixel value → label. Keys are whole numbers; several may share a label.
      additionalProperties:
        type: string
        minLength: 1

    RasterFilterCreatePayload:
      type: object
      additionalProperties: false
      required:
        - name
        - description
        - file_id
        - kind
      properties:
        name:
          type: string
          minLength: 1
          description: >-
            Also gives the raster filter its id, once: the name in snake_case, prefixed with `rf_` unless it
            starts with a letter, and suffixed with `_2`, `_3`... when taken. The id never follows a rename and
            is never reissued after a DELETE.
        description:
          type: string
        file_id:
          type: string
          description: A raster file uploaded with POST /files, used by no dataset or other raster filter
        band:
          type: integer
          minimum: 1
          description: >-
            The band to install, numbered from 1. The other bands are discarded. Required when the file has
            more than one band; defaults to 1 when it has one.
        kind:
          type: string
          enum: [categorical]
          description: Continuous raster filters are not supported yet

    RasterFilterPatchPayload:
      type: object
      minProperties: 1
      properties:
        active:
          type: boolean
          description: Whether this raster filter should be available for use.
        name:
          type: string
          minLength: 1
        description:
          type: string

    Entitlements:
      type: object
      description: >-
        Flat map of key (a dataset slug, or a freeform config key under the `configs` scope) to
        the list of capabilities granted for it. Used both by `GET /entitlements` (one scope's
        slice) and by `GET`/`PUT /datasets/{datasetId}/entitlements` (always the `datasets` scope).
      additionalProperties:
        type: array
        items:
          type: string
          enum:
            - preview
            - download
            - obfuscate_as_points
            - obfuscate_as_polygons
            - read
            - write

    InviteGrants:
      type: object
      description: >-
        What an Invite grants, in the shape of a Subject's Entitlements: Dataset slugs under
        `datasets`, config item ids under `configs`.
      additionalProperties: false
      properties:
        datasets:
          type: object
          additionalProperties:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              enum:
                - preview
                - download
        configs:
          type: object
          additionalProperties:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              enum:
                - read
                - write

    InviteCreate:
      type: object
      additionalProperties: false
      required:
        - grants
      properties:
        grants:
          $ref: '#/components/schemas/InviteGrants'
        recipient:
          type: string
          format: email
          maxLength: 320
          description: Only the person with this email can redeem it. Never with `reusable`.
        reusable:
          type: boolean
          default: false
          description: Redeemable by anyone with the link until it expires, instead of once.
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 30
          default: 7

    Invite:
      type: object
      required:
        - id
        - grants
        - recipient
        - reusable
        - status
        - expires_at
        - created_by
        - created_at
        - redemptions
      properties:
        id:
          type: string
          format: uuid
        grants:
          $ref: '#/components/schemas/InviteGrants'
        recipient:
          type: string
          nullable: true
        reusable:
          type: boolean
        status:
          type: string
          enum:
            - pending
            - used
            - expired
        expires_at:
          type: string
          format: date-time
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        redemptions:
          type: array
          description: Who redeemed it, oldest first
          items:
            type: object
            required:
              - subject
              - redeemed_at
            properties:
              subject:
                type: string
              redeemed_at:
                type: string
                format: date-time

    InviteCreated:
      allOf:
        - $ref: '#/components/schemas/Invite'
        - type: object
          required:
            - token
          properties:
            token:
              type: string
              description: >-
                Returned only here. The link carries it in its fragment (`/invite#<token>`), so no
                server logs it.

    DataAvailabilityIndex:
      type: object
      properties:
        resolution:
          type: number
        min:
          type: number
        max:
          type: number
        cells:
          type: object
          additionalProperties:
            type: number

    cleaningReportModifications:
      type: object
      properties:
        reason:
          type: string
          enum: [depth_rounded, value_rounded, unit_converted, label_resolved]
        count:
          type: number

    cleaningReportRowDeletions:
      type: object
      properties:
        reason:
          type: string
          enum: [mixed_data_type, invalid_coordinates, invalid_depth_interval, minimum_data_requirement, duplicate_row]
        count:
          type: number

    cleaningReportCellDeletions:
      type: object
      properties:
        reason:
          type: string
          enum: [non_numeric, negative_value, zero_value, out_of_bounds, below_lod, unknown_class]
        count:
          type: number
        property:
          type: string
          nullable: true

    CleaningReport:
      type: object
      properties:
        summary:
          type: object
          properties:
            values_modified:
              type: number
            rows_deleted:
              type: number
            cells_deleted:
              type: number
        gis_datatype:
          type: string
          nullable: true
        modifications:
          type: array
          items:
            $ref: '#/components/schemas/cleaningReportModifications'
        row_deletions:
          type: array
          items:
            $ref: '#/components/schemas/cleaningReportRowDeletions'
        cell_deletions:
          type: array
          items:
            $ref: '#/components/schemas/cleaningReportCellDeletions'
        long_format:
          $ref: '#/components/schemas/LongFormatStats'
    LongFormatStats:
      type: object
      description: >
        What the pivot of a long file left out, in rows of the file. Each row is counted once, under
        the first reason that applies, so the values passed on to the cleaning are source_rows less
        the rest. Written when the file is staged; only for a long file.
      properties:
        source_rows:
          type: integer
          description: Rows read from the file
        empty_value_rows:
          type: integer
          description: Rows with no value
        empty_property_rows:
          type: integer
          description: Rows with no property code
        unmapped_measurement_type_rows:
          type: integer
          description: Rows of measurement types that are not mapped, and so are not loaded
        repeated_values_removed:
          type: integer
          description: Rows that repeat the value of an earlier row at the same location, depth and measurement type
