name: Docker build

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

jobs:

  gate:
    name: Contributor Gate
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/gate-check-reusable.yaml
    with:
      username: ${{ github.event.pull_request.user.login }}
      base-sha: ${{ github.event.pull_request.base.sha }}
      author-association: ${{ github.event.pull_request.author_association }}

  image-version:
    name: Determine Image Version
    needs:
      - gate
    if: always() && (needs.gate.result == 'skipped' || needs.gate.outputs.allowed == 'true')
    runs-on: ubuntu-latest
    outputs:
      imageVersion: ${{ steps.image_version.outputs.imageVersion }}
    steps:
      - name: Set imageVersion
        id: image_version
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "imageVersion=pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "imageVersion=${{ github.sha }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "imageVersion=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

  build-push-docker-backend:
    uses: ./.github/workflows/docker-build-reusable.yaml
    needs: 
      - gate
      - image-version
    if: always() && (needs.gate.result == 'skipped' || needs.gate.outputs.allowed == 'true')
    with:
      context: backend
      image-name: soilhive-core-backend
      image-version: ${{ needs.image-version.outputs.imageVersion }}
    permissions:
      contents: read
      packages: write
      pull-requests: write

  build-push-docker-frontend:
    uses: ./.github/workflows/docker-build-reusable.yaml
    needs: 
      - gate
      - image-version
    if: always() && (needs.gate.result == 'skipped' || needs.gate.outputs.allowed == 'true')
    with:
      context: frontend
      image-name: soilhive-core-frontend
      image-version: ${{ needs.image-version.outputs.imageVersion }}
    permissions:
      contents: read
      packages: write
      pull-requests: write

  # The performance suite as a scheduled job (docs/adr/0029). Note the context
  # is `backend`, not the Dockerfile's own directory: a context holding only
  # src/scripts/perf could not reach package.json or tests/assets/geojson, which
  # the suite reads at runtime. Built on pull requests like the other two, so a
  # change to the container's behaviour can be validated from a PR-tagged image
  # rather than only after merging.
  build-push-docker-perf:
    uses: ./.github/workflows/docker-build-reusable.yaml
    needs: 
      - gate
      - image-version
    if: always() && (needs.gate.result == 'skipped' || needs.gate.outputs.allowed == 'true')
    with:
      context: backend
      file: backend/src/scripts/perf/Dockerfile
      image-name: soilhive-core-perf
      image-version: ${{ needs.image-version.outputs.imageVersion }}
      # There is no .git in the image, so the run fingerprint's provenance has
      # to be baked in. head_ref is only set for pull requests; ref_name is the
      # branch or tag otherwise.
      build-args: |
        GIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}
        GIT_BRANCH=${{ github.head_ref || github.ref_name }}
    permissions:
      contents: read
      packages: write
      pull-requests: write

