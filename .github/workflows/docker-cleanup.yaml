name: Docker images Cleanup

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_call:
    inputs:
      image-name:
        description: The name of the Docker image to clean up
        type: string
        required: true
      image-version:
        description: The version that failed to build. Deletes the tags <version>, <version>-amd64 and <version>-arm64, only on versions created by this run attempt
        type: string
        required: true

jobs:
  delete-images:
    runs-on: ubuntu-latest
    permissions:
      actions: read # To read when this run attempt started
      packages: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Delete images from GHCR
        env:
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          INPUT_IMAGE_NAME: ${{ inputs.image-name }}
          INPUT_IMAGE_VERSION: ${{ inputs.image-version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # github.event_name is the caller's event inside a called workflow, never
          # "workflow_call", so detect the workflow_call path by its required input
          if [[ -n "${INPUT_IMAGE_NAME}" ]]; then
            # A build failed: delete what this run pushed, and nothing else
            if [[ -z "${INPUT_IMAGE_VERSION}" ]]; then
              echo "::error::image-version is empty, so every tag would match. Nothing deleted"
              exit 1
            fi
            PACKAGE_NAMES=("${INPUT_IMAGE_NAME}")
            # Exact tags, not a prefix: v1.1.1 must not match v1.1.10 or v1.1.1-rc.1
            EXACT_TAGS=$(jq -cn --arg v "${INPUT_IMAGE_VERSION}" '[$v, "\($v)-amd64", "\($v)-arm64"]')
            TAG_PREFIX=""
            # Only versions created by this run attempt, so a failed re-run of a
            # published tag never deletes the image that is already deployed
            CREATED_SINCE=$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}" --jq '.run_started_at')
            if [[ -z "${CREATED_SINCE}" || "${CREATED_SINCE}" == "null" ]]; then
              echo "::error::Could not read when this run attempt started. Nothing deleted"
              exit 1
            fi
          else
            # A PR was closed: delete all its images
            if [[ -z "${PR_NUMBER}" ]]; then
              echo "::error::No pull request number. Nothing deleted"
              exit 1
            fi
            PACKAGE_NAMES=("soilhive-core-backend-dev" "soilhive-core-frontend-dev")
            EXACT_TAGS='[]'
            TAG_PREFIX="pr-${PR_NUMBER}-"
            CREATED_SINCE=""
          fi

          if gh api "/orgs/${OWNER}" --silent 2>/dev/null; then
            API_BASE="orgs/${OWNER}"
          else
            API_BASE="users/${OWNER}"
          fi

          echo "Looking for tags ${EXACT_TAGS}, tag prefix '${TAG_PREFIX}', created since '${CREATED_SINCE}'"

          for PACKAGE_NAME in "${PACKAGE_NAMES[@]}"; do
            echo "Package: ${PACKAGE_NAME}"
            if ! VERSIONS=$(gh api "${API_BASE}/packages/container/${PACKAGE_NAME}/versions" \
              --paginate \
              --jq '.[] | {id: .id, created_at: .created_at, tags: (.metadata.container.tags // [])}'); then
              echo "Package ${PACKAGE_NAME} not found, skipping"
              continue
            fi

            # ISO 8601 UTC timestamps compare correctly as strings
            MATCHES=$(echo "$VERSIONS" | jq -c \
              --argjson exact "${EXACT_TAGS}" \
              --arg prefix "${TAG_PREFIX}" \
              --arg since "${CREATED_SINCE}" \
              'select(any(.tags[]; IN($exact[]) or ($prefix != "" and startswith($prefix))))
               | select($since == "" or .created_at >= $since)')

            while IFS= read -r version; do
              [[ -n "$version" ]] || continue
              VERSION_ID=$(echo "$version" | jq -r '.id')
              echo "Deleting version ${VERSION_ID} (tags: $(echo "$version" | jq -r '.tags | join(" ")'))"
              gh api --method DELETE \
                "${API_BASE}/packages/container/${PACKAGE_NAME}/versions/${VERSION_ID}" \
                && echo "Deleted ${VERSION_ID}" \
                || echo "Failed to delete ${VERSION_ID}, skipping"
            done <<< "$MATCHES"
          done
